<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Холст</title>
<style>
  html,body{margin:0;height:100%;background:#050505;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  #stage{position:relative;width:100vw;height:100vh;background:radial-gradient(ellipse at 50% 42%, #32353a 0%, #24262a 32%, #16181c 62%, #0d0f11 100%);overflow:hidden;touch-action:none;}
  #world{position:absolute;transform-origin:50% 50%;}
  #ghost,#front,#frontBelow,#frontAbove,#notes,#notesBelow,#notesAbove{position:absolute;left:0;top:0;}
  .frame{box-sizing:border-box;position:absolute;border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 60px 12px rgba(0,0,0,.5);background:#f4f2ee;border-radius:var(--corner-r);}
  /* lives OUTSIDE #world (not scaled with it) so its thickness stays
     constant in screen pixels no matter how far the camera has zoomed.
     Its border-radius is set from JS (screen px = world radius * viewZoom)
     so the rounded corner visually tracks the frame's radius at any zoom. */
  #focusRing{position:absolute;left:0;top:0;box-sizing:border-box;pointer-events:none;border:2px solid rgba(150,255,175,.95);box-shadow:0 0 16px 2px rgba(150,255,175,.45);opacity:0;transition:opacity .15s ease;}
  .handleZone{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-22px;margin-top:-22px;}
  .handleZone.tl{cursor:nwse-resize;}
  .handleZone.tr{cursor:nesw-resize;}
  .handleZone.bl{cursor:nesw-resize;}
  .handleZone.br{cursor:nwse-resize;}
  .handle{width:11px;height:11px;border-radius:3px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.35);opacity:0;transition:opacity .12s ease;}
  .handleZone:hover .handle{opacity:1;}
  .ratioTag{position:absolute;color:rgba(255,255,255,.7);font-size:11px;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:5px;opacity:0;transition:opacity .12s ease;pointer-events:none;}
  /* left edge, sitting a bit above dead-center: top edge = 50% minus the
     bar's own full rendered height (276px = 6 buttons*38 + 5 gaps*6 +
     padding 8*2 + border 1*2*2), which works out to the bar's CENTER
     landing half its own height above viewport-center — same 22px edge
     offset as the left side. If button count/sizing changes, 276 needs
     updating to match. max() keeps it from crossing the same 22px floor
     on short viewports, same idea as effectiveBias() below but for the
     toolbar's own position rather than the camera's.
     LEFT_CLEARANCE in the JS below is sized to this rect's width; move
     this and update that. */
  #toolbar{position:absolute;left:22px;top:max(22px, calc(50% - 276px));display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:rgba(255,255,255,.05);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);}
  #toolbar button{width:38px;height:38px;border-radius:9px;border:none;background:transparent;color:rgba(255,255,255,.55);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:box-shadow .15s ease;}
  #toolbar button svg{display:block;} /* inline svg default is inline-block and leaves a few px of phantom baseline gap otherwise */
  #toolbar button.active{background:rgba(255,255,255,.14);color:#fff;}
  #toolbar button:disabled{color:rgba(255,255,255,.18);cursor:default;}
  #toolbar button.locate{box-shadow:inset 0 0 0 2px rgba(150,255,175,.95), 0 0 10px 1px rgba(150,255,175,.45);}
  /* same idea as .locate above (pen: "the window is out of view, click to
     go find it"), but red and on moveBtn itself instead of the frame —
     "no, can't move it from here" rather than an invitation to click
     anything. Lives directly on the always-on-screen button rather than
     trying to highlight the window's own (possibly off-screen) position,
     which needs no clamping or positioning math at all. */
  #moveBtn.blocked{box-shadow:inset 0 0 0 2px rgba(255,90,90,.95), 0 0 10px 1px rgba(255,90,90,.45);}
  /* moveBtn is a press-and-hold joystick, not a select-then-use-elsewhere
     tool like pen/eraser (see its JS wiring) — cursor hints at "grab"
     before the gesture starts. Once actually dragging, the cursor is
     hidden globally (html.moving-ink below): the gesture reads mouse
     MOVEMENT, not the cursor's absolute position, so there's nothing on
     screen for a visible cursor to meaningfully track anyway, and a
     cursor drifting away from the button while the drawing shifts under
     an unrelated point would just be confusing. */
  #moveBtn{cursor:grab;touch-action:none;}
  #moveBtn:active{cursor:grabbing;}
  html.moving-ink, html.moving-ink *{cursor:none!important;}
  #zoom{position:absolute;bottom:24px;right:24px;display:flex;gap:8px;align-items:center;color:rgba(255,255,255,.4);font-size:12px;}
  #zoom button{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);cursor:pointer;}
  /* storyboard filmstrip: lives OUTSIDE #world (like focusRing/handles) so
     it tracks the drawing window's own on-screen rect frame-by-frame —
     magnetized directly under the active canvas, not a separate app-level
     bar. Revealed only once the cursor drops below the window. */
  #filmstrip{position:absolute;left:0;top:0;display:flex;justify-content:center;opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity .15s ease, transform .15s ease;z-index:5;}
  #filmstrip.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
  /* fade-to-transparent at both ends instead of a hard clip — so a tile
     that's only partially scrolled into view dissolves at the edge rather
     than being sliced off flat. Width of the fade is set from JS (px, so
     it stays constant regardless of tile size) via --fade var. Scrollbar
     itself is hidden since the fade already communicates "more this way". */
  #filmTrack{display:flex;gap:8px;max-width:100%;overflow-x:auto;background:transparent;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 var(--fade,0px), #000 calc(100% - var(--fade,0px)), transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, #000 var(--fade,0px), #000 calc(100% - var(--fade,0px)), transparent 100%);
    scrollbar-width:none;}
  #filmTrack::-webkit-scrollbar{display:none;}
  .filmThumb{box-sizing:border-box;border-radius:6px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);border:2px solid transparent;display:block;flex:none;}
  .filmThumb.active{border-color:rgba(150,255,175,.9);}
  .filmThumb:hover{border-color:rgba(255,255,255,.4);}
  .filmThumb.active:hover{border-color:rgba(150,255,175,.9);}
  .filmAdd{box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px dashed rgba(255,255,255,.3);color:rgba(255,255,255,.5);cursor:pointer;font-size:20px;transition:color .12s ease, border-color .12s ease;}
  .filmAdd:hover{color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.55);}
  /* layer rail: same appear-on-hover / scroll-with-fade mechanic as the
     filmstrip above, rotated 90° — a vertical column of circles to the
     RIGHT of the frame instead of a horizontal row of aspect-matched
     tiles below it. Circles are a fixed round shape regardless of the
     scene's own frame aspect (unlike filmThumb, which reshapes per
     scene) — see renderLayerRail()'s comment for how content is cropped
     to fit that fixed shape. */
  #layerRail{position:absolute;left:0;top:0;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateX(10px);pointer-events:none;transition:opacity .15s ease, transform .15s ease;z-index:5;}
  #layerRail.visible{opacity:1;transform:translateX(0);pointer-events:auto;}
  #layerTrack{display:flex;flex-direction:column;gap:8px;max-height:100%;overflow-y:auto;background:transparent;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 var(--fade,0px), #000 calc(100% - var(--fade,0px)), transparent 100%);
    mask-image:linear-gradient(to bottom, transparent 0, #000 var(--fade,0px), #000 calc(100% - var(--fade,0px)), transparent 100%);
    scrollbar-width:none;}
  #layerTrack::-webkit-scrollbar{display:none;}
  .layerThumb{box-sizing:border-box;border-radius:50%;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);border:2px solid transparent;display:block;flex:none;}
  .layerThumb.active{border-color:rgba(150,255,175,.9);}
  .layerThumb:hover{border-color:rgba(255,255,255,.4);}
  .layerThumb.active:hover{border-color:rgba(150,255,175,.9);}
  .layerAdd{box-sizing:border-box;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px dashed rgba(255,255,255,.3);color:rgba(255,255,255,.5);cursor:pointer;font-size:18px;transition:color .12s ease, border-color .12s ease;}
  .layerAdd:hover{color:rgba(255,255,255,.9);border-color:rgba(255,255,255,.55);}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="ghost"></canvas>
    <canvas id="notesBelow"></canvas>
    <canvas id="notes"></canvas>
    <canvas id="notesAbove"></canvas>
    <div class="frame" id="frameBox"></div>
    <canvas id="frontBelow"></canvas>
    <canvas id="front"></canvas>
    <canvas id="frontAbove"></canvas>
  </div>
  <div id="layerRail"><div id="layerTrack"></div></div>
  <div class="ratioTag" id="ratioTag"></div>
  <div id="focusRing"></div>
  <div class="handleZone tl" data-corner="tl"><div class="handle"></div></div>
  <div class="handleZone tr" data-corner="tr"><div class="handle"></div></div>
  <div class="handleZone bl" data-corner="bl"><div class="handle"></div></div>
  <div class="handleZone br" data-corner="br"><div class="handle"></div></div>

  <div id="toolbar">
    <button data-tool="pen" class="active" title="Перо">✏</button>
    <button data-tool="eraser" title="Ластик">⌫</button>
    <button id="moveBtn" title="Сдвинуть рисунок — зажать и тянуть в любую сторону">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="3" x2="12" y2="21"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <polyline points="9,6 12,3 15,6"/>
        <polyline points="9,18 12,21 15,18"/>
        <polyline points="6,9 3,12 6,15"/>
        <polyline points="18,9 21,12 18,15"/>
      </svg>
    </button>
    <button id="undoBtn" title="Отменить действие">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 7 4 12l5 5"/>
        <path d="M4 12h11a5 5 0 0 1 0 10h-1"/>
      </svg>
    </button>
    <button id="redoBtn" title="Повторить действие">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 7 20 12l-5 5"/>
        <path d="M20 12H9a5 5 0 0 0 0 10h1"/>
      </svg>
    </button>
    <button id="clearBtn" title="Очистить">✕</button>
  </div>

  <div id="zoom">
    <button id="zOut">–</button>
    <span id="zLabel">100%</span>
    <button id="zIn">+</button>
  </div>

  <div id="filmstrip"><div id="filmTrack"></div></div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const ghost = document.getElementById('ghost');
  const front = document.getElementById('front');
  const fctx = front.getContext('2d');
  // Every layer in the active scene EXCEPT the one currently active for
  // drawing gets flattened into one of two composites, split by real
  // stacking order (layers[0] = bottom of the stack, layers[length-1] =
  // top — see addLayerAbove/addLayerBelow): frontBelow/notesBelow holds
  // everything with a LOWER index than the active layer, painted UNDER
  // front/notes; frontAbove/notesAbove holds everything with a HIGHER
  // index, painted OVER front/notes. That's what lets the active layer
  // sit at its real position in the stack instead of always appearing on
  // top — draw on a layer you added "below" an existing one, and a layer
  // above it correctly occludes your strokes there, matching what
  // layers are supposed to do.
  // This is also what makes erasing layer-safe: front/notes are
  // repainted straight from the active layer's own segments (exactly as
  // before layers existed), so an eraser stroke there only ever touches
  // pixels that came from THIS layer. frontBelow/Above are rebuilt by
  // renderStaticLayers() only when the active layer or scene changes
  // (see there), never on every stroke, and never share a bitmap with
  // front/notes or with each other.
  const frontBelow = document.getElementById('frontBelow');
  const fctxBelow = frontBelow.getContext('2d');
  const frontAbove = document.getElementById('frontAbove');
  const fctxAbove = frontAbove.getContext('2d');
  const notes = document.getElementById('notes');
  const nctx = notes.getContext('2d');
  const notesBelow = document.getElementById('notesBelow');
  const nctxBelow = notesBelow.getContext('2d');
  const notesAbove = document.getElementById('notesAbove');
  const nctxAbove = notesAbove.getContext('2d');
  // reused scratch pair for isolating ONE non-active layer's own ink
  // before it's flattened onto frontBelow/Above or notesBelow/Above —
  // never attached to the DOM, exists purely as an off-screen buffer.
  // Cleared and reused for each layer in turn rather than allocated
  // per-layer, since renderStaticLayers() only ever needs one at a time.
  const groupScratchF = document.createElement('canvas');
  const gsfCtx = groupScratchF.getContext('2d');
  const groupScratchN = document.createElement('canvas');
  const gsnCtx = groupScratchN.getContext('2d');
  const frameBox = document.getElementById('frameBox');
  const focusRing = document.getElementById('focusRing');
  const zLabel = document.getElementById('zLabel');
  const ratioTag = document.getElementById('ratioTag');
  const penBtn = document.querySelector('#toolbar button[data-tool="pen"]');

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  // shifts the whole "centered" position up by this many screen px (a
  // raw, zoom-independent offset — same units panX/panY already use),
  // trading some of the empty margin above the canvas for more breathing
  // room below it, where the filmstrip lives. Every place that means
  // "centered" — the default camera position, recenterView()'s target,
  // isFocused()'s reference point, and the safe-area budget below —
  // needs to agree on this same number.
  const VERTICAL_BIAS = 60;
  // shrinks toward 0 on very short viewports instead of insisting on the
  // full bias — otherwise, on a short enough window, shifting up by a
  // fixed 60px could itself push the box past the top clearance margin,
  // which defeats the point (the bias is supposed to make room, not eat
  // into the one margin that must never be crossed).
  function effectiveBias(){
    if(!H) return VERTICAL_BIAS;
    return Math.max(0, Math.min(VERTICAL_BIAS, H/2 - TOP_CLEARANCE - 20));
  }
  let W, H, CW, CH;
  // #world's own box size (its CSS width/height, and therefore where its
  // transform-origin/center sits in logical coordinates) is set ONCE and
  // never changed again — see the note inside resize() for why.
  let WORLD_W, WORLD_H;
  // the canvas bitmaps (ghost/front/notes) are a finite window onto an
  // otherwise-unbounded logical coordinate space — canvasOriginX/Y is the
  // logical point that maps to the buffer's pixel (0,0). frame.x/y and every
  // stroke stay in pure logical space forever and never need to change;
  // only this window's position/size adapts to follow the camera.
  let canvasOriginX = 0, canvasOriginY = 0;
  // frame now stores its own top-left position explicitly (world coords),
  // not derived from center — needed so the top-left handle can resize
  // around a fixed opposite (bottom-right) anchor point.
  let frame = { x:0, y:0, w:640, h:360 };
  // corner rounding, in world px — handles/clip/selection all key off this
  // single constant, while frame.x/y/w/h keep describing the *virtual*
  // sharp-cornered rectangle the round corner is carved out of
  // corner rounding — kept proportional to the frame's own size (ratio set
  // by the initial 640×360 frame at 18px) so it looks the same whether the
  // window has been resized bigger or smaller, instead of a fixed px value
  // that reads as "more/less rounded" purely because the frame changed size
  let CORNER_R = 18;
  const CORNER_RATIO = CORNER_R / Math.min(frame.w, frame.h);
  function updateCornerRadius(){
    CORNER_R = Math.max(4, Math.min(frame.w, frame.h) * CORNER_RATIO);
    frameBox.style.setProperty('--corner-r', CORNER_R+'px');
  }
  let tool = 'pen';
  let drawing = false;
  // true while ANY corner handle is being dragged — hides the "click to
  // recenter" ring during a resize/zoom/format drag so it doesn't fire
  // just because the cursor happens to pass over the window mid-drag
  let cornerDragging = false;
  let last = null;
  // The window's ON-SCREEN footprint is auto-normalized so any shot,
  // whatever its own logical size/aspect, always displays at the same
  // comfortable size — switching shots, or resizing one, never makes the
  // window itself jump bigger/smaller on screen. `zoomMultiplier` is the
  // user's own deliberate zoom-in/out on top of that automatic baseline
  // (wheel / +- buttons); `viewZoom` is the actual, effective CSS scale
  // applied, recomputed by updateZoom() whenever the frame's size or the
  // multiplier changes.
  const FIT_REF = 640; // on-screen px for whichever side is longer, at multiplier 1 — matches the original default 640x360 frame's size at 100%
  // space always reserved around the frame box, so switching to a tall
  // (portrait/square) format can never push the frame under the toolbar
  // on the left or the filmstrip tray off the bottom — a plain "longer
  // side = FIT_REF" rule has no idea those exist, and will happily size
  // a 9:16 shot as if the whole viewport were free for drawing. These
  // five are independent — fitZoomFor() below checks each opposing pair
  // separately rather than folding them into one number, because neither
  // axis is symmetric: vertically the canvas sits above dead-center (see
  // VERTICAL_BIAS) so top/bottom differ, and horizontally the left side
  // has the toolbar to clear while the right side has the layer rail, so
  // left/right differ too (by different amounts, since the two panels
  // aren't the same width). Changing any one on its own is safe.
  const TOP_CLEARANCE = 30, BOTTOM_CLEARANCE = 30, LEFT_CLEARANCE = 100, RIGHT_CLEARANCE = 110, TRAY_GAP = 10, RAIL_GAP = 10;
  // shared with renderFilmstrip() below: no single tile (any scene's own
  // thumbnail, or the active shot's own future one) is ever allowed to be
  // taller than this, however extreme its aspect ratio — a portrait tile
  // shrinks its WIDTH instead once it hits this, rather than growing
  // downward off-screen.
  const MAX_TILE_H = 120;
  // circles in the layer rail (renderLayerRail() below) are a FIXED
  // diameter rather than reshaped per frame height like filmstrip tiles
  // are — see LAYER_D's own definition inside renderLayerRail() for where
  // that number comes from and why. LAYER_D_MIN below is the floor for
  // the one case a fixed size can't handle on its own (a frame too short
  // to fit the normal count at full size) — see the shrink branch there.
  const LAYER_D_MIN = 32;
  function fitZoomFor(w, h){
    const base = FIT_REF / Math.max(w, h);
    // W/H aren't set until resize() runs (right at the very end of
    // startup) — updateZoom() is called once before that, so fall back
    // to the plain baseline until real viewport dimensions exist rather
    // than compute against undefined and end up with NaN.
    if(!W || !H) return base;
    // reserve the FULL worst-case tray height (MAX_TILE_H), not just
    // whatever this particular shot's own thumbnail would need — another
    // scene elsewhere in the storyboard can have a completely different
    // (and, up to that same cap, much taller) aspect ratio, and its tile
    // sits in the very same row, regardless of what shape is active now.
    //
    // Two SEPARATE constraints, not one combined number: the box is
    // vertically centered around (H/2 - VERTICAL_BIAS), so the space
    // above it and below it shrink/grow independently as the box grows,
    // and each side has its own thing to clear (plain margin above, tray
    // below). Adding both clearance numbers into one budget only
    // happened to work by coincidence when there was no bias (the two
    // sides were symmetric); with a bias they're genuinely different
    // constraints and must be checked separately.
    const bias = effectiveBias();
    const safeH_top = (H - 2*TOP_CLEARANCE - 2*bias) / h;
    const safeH_bottom = (H + 2*bias - 2*(TRAY_GAP + MAX_TILE_H + BOTTOM_CLEARANCE)) / h;
    const safeH = Math.min(safeH_top, safeH_bottom);
    // same idea horizontally: the frame is NOT horizontally biased (panX
    // defaults to 0, dead-center), but the two sides still aren't
    // symmetric, since only the left one has the toolbar to clear — so
    // this is a sum of two different numbers, not one doubled.
    const safeW = (W - LEFT_CLEARANCE - RIGHT_CLEARANCE) / w;
    return Math.max(0.05, Math.min(base, safeH, safeW));
  }
  let zoomMultiplier = 1;
  let viewZoom = 1;
  function updateZoom(){
    viewZoom = fitZoomFor(frame.w, frame.h) * zoomMultiplier;
  }
  updateZoom();
  // camera pan (screen px, applied outside the zoom scale so wheel-pan
  // distance feels the same regardless of current zoom level)
  let panX = 0, panY = -VERTICAL_BIAS;
  // eased pan destination while animating back to center; null = not animating
  let panTarget = null;
  let panFrom = null, panStart = 0;
  const PAN_DURATION = 650; // ms
  // critically-damped "docking" curve: brisk approach, then a distinct,
  // resistance-like slow-down right at the end — reads as the window being
  // pulled into place and fixed, not just arriving. No overshoot/bounce.
  const DOCK_W = 7;
  function easeDock(t){
    if(t>=1) return 1;
    return 1 - (1+DOCK_W*t)*Math.exp(-DOCK_W*t);
  }
  // is the window currently near the middle of the viewport? Drives the
  // "come back and click to recenter" affordance once the camera has
  // panned away from it.
  let focused = true;
  let ringVisible = false;
  const FOCUS_SNAP = 60;

  // One continuous drawing on an infinite world surface. Every segment is
  // stored once, in absolute world coordinates, regardless of whether it's
  // currently inside or outside the window — "inside vs outside" is not a
  // property of the data, it's recomputed at render time from `frame`.
  // Storyboard support: each "scene" owns its own drawing window (frame
  // position/size/format) plus camera (zoom/pan) — switching scenes
  // restores that shot's own framing, so resizing/reformatting/zooming
  // one panel can never bleed into any other.
  //
  // Layer support: a scene's ink isn't one segment list anymore but a
  // stack of LAYERS (scenes[i].layers[]), each with its own segments —
  // all the same size/format as the scene's single shared `frame` (the
  // brief: layers don't get their own window, only the scene does).
  // scenes[i].activeLayer is which one currently receives drawing.
  // Undo/redo history is per-LAYER, for the same reason it's per-scene:
  // an action taken on one layer's ink should never be undoable from a
  // different layer. Each history entry is one whole stroke
  // (pointerdown..pointerup) or one whole clear, never a single segment
  // — see commitStroke/pushClearHistory below.
  let scenes = [{
    frame: frame, zoomMultiplier: zoomMultiplier, panX: panX, panY: panY,
    layers: [{ segments: [], history: [], future: [], inkVersion: 0 }],
    activeLayer: 0, inkVersion: 0
  }];
  let activeScene = 0;
  let strokeSegments = scenes[activeScene].layers[0].segments;
  let history = scenes[activeScene].layers[0].history;
  let future = scenes[activeScene].layers[0].future;

  // Writes the live camera/window state back into whichever scene
  // currently owns it. `frame` is always a direct reference to the active
  // scene's own frame object (see loadView), so its x/y/w/h are already
  // live in place — only the primitive multiplier/pan numbers need
  // copying back before `frame` gets pointed at a different scene.
  function saveView(){
    const sc = scenes[activeScene];
    sc.zoomMultiplier = zoomMultiplier; sc.panX = panX; sc.panY = panY;
  }
  // Points the live frame/zoomMultiplier/panX/panY vars at the now-active
  // scene's own stored state, recomputes the effective viewZoom for its
  // (possibly different-shaped) window, and cancels any in-flight
  // pan/format animation, since that belonged to the scene being left.
  // Layer data is a separate step — see loadLayer() — since scene and
  // layer identity change independently of one another (switchLayer()
  // needs the layer half without touching the camera at all).
  function loadView(){
    const sc = scenes[activeScene];
    frame = sc.frame;
    zoomMultiplier = sc.zoomMultiplier; panX = sc.panX; panY = sc.panY;
    updateZoom();

    elastic.active = false;
    ratioTag.style.opacity = '0';
  }
  // Points strokeSegments/history/future at whichever layer is now active
  // in the active scene. Called after loadView() on a scene switch, and
  // alone on a plain layer switch (camera/frame never change for that).
  function loadLayer(){
    const layer = scenes[activeScene].layers[scenes[activeScene].activeLayer];
    strokeSegments = layer.segments;
    history = layer.history; future = layer.future;
    updateHistoryButtons();
  }
  // Starting state for a brand-new scene: the SAME window SHAPE (aspect
  // ratio/format) as whatever's currently active, so a new panel matches
  // your storyboard's established framing — but always at the baseline
  // SIZE for that shape (longer side = FIT_REF), always default zoom, and
  // always centered with no pan offset. Cloning the current pan would
  // carry forward wherever the camera happened to be sitting on the
  // previous scene — if that scene had been panned away from center, the
  // new one would open off-center too (unfocused, first click just
  // recenters instead of drawing) even though nothing about the new
  // scene itself was ever moved. Always starts with exactly one empty
  // layer, active — same "nothing drawn yet" starting point layers had
  // before this scene existed.
  function newSceneData(){
    const s = FIT_REF / Math.max(frame.w, frame.h);
    const w = frame.w*s, h = frame.h*s;

    // resize() runs. Panning/zooming can make ensureCanvasCoverage()
    // repurpose the same two variables to describe the canvas bitmap's
    // coverage window instead (a different size, off a different origin)
    // — reading them here would silently miscenter the new scene as soon
    // as that's happened. #world's own style is never touched by
    // coverage, so it's the one reliable source for its true box size.
    const worldW = parseFloat(world.style.width), worldH = parseFloat(world.style.height);

      frame: { x: worldW/2-w/2, y: worldH/2-h/2, w, h },

      activeLayer: 0, inkVersion: 0

    last = null;
    positionFrame();
    renderAll();

  // the stack, index length-1 is the TOP — layers[i] paints over
  // layers[i-1], same order renderStaticLayers() already composites them
  // in. "Above"/"below" throughout this section refer to that, not to
  // draw order in time.
  //
  // Creates a new, empty layer ABOVE everything currently in the scene

  // addScene(): always available no matter how many layers already sit
  // above the one you started from, exactly like the brief asks for.
  function addLayerAbove(){
    if(gestureInProgress()) return;

  // currently in the scene — inserted at the front of the array — and
  // switches to it. Mirrors prependScene(): every existing layer's index
  // shifts up by one, so activeLayer is set directly (0) rather than
  // patched, same reason prependScene() sets activeScene=0 directly
  // instead of trying to track the shift. Doesn't go through
  // switchLayer() itself: that function's own "already active" guard
  // compares against the OLD (about to be stale) activeLayer, which
  // isn't meaningful once every index has just moved.
  function addLayerBelow(){
    if(gestureInProgress()) return;
    const sc = scenes[activeScene];
    sc.layers.unshift({ segments: [], history: [], future: [], inkVersion: 0 });
    sc.inkVersion = (sc.inkVersion||0) + 1;
    sc.activeLayer = 0;
    last = null;
    loadLayer();
    renderAll();
  }
  // Switching layers never touches frame/camera — every layer in a scene
  // shares that scene's own single frame/zoom/pan (the brief: layers are
  // uniform size/format, unlike scenes). Only which segment list is
  // "live" for drawing/undo changes, plus which OTHER layers now need
  // compositing above vs below it — see renderStaticLayers().
  function switchLayer(idx){
    if(gestureInProgress()) return;
    const sc = scenes[activeScene];
    if(idx===sc.activeLayer || idx<0 || idx>=sc.layers.length) return;
    sc.activeLayer = idx;
    last = null;
    loadLayer();
    renderAll();
  }
  // ghost/background-duplicate layer intentionally removed from the active
  // logic (see brief) — the `ghost` canvas element stays in the DOM as a
  // placeholder, reserved for a future, different treatment.
  // RESERVED (not a bug, do not delete): planned to show a large preview
  // of a frame's saved drawing behind it the first time that frame is
  // opened, for a dramatic "reveal" effect. Remove this comment and the
  // reservation once that feature is actually implemented.

  // standard aspect-ratio presets for the top-left "format" handle
  const PRESETS = [
    {w:2.39,h:1,label:'2.39:1'},
    {w:2.00,h:1,label:'2.00:1'},
    {w:1.85,h:1,label:'1.85:1'},
    {w:16,h:9,label:'16:9'},
    {w:1,h:1,label:'1:1'},
    {w:4,h:3,label:'4:3'},
    {w:9,h:16,label:'9:16'},
  ];
  function nearestPreset(ratio){
    let best = PRESETS[0], bestDiff = Infinity;
    for(const p of PRESETS){
      const d = Math.abs((p.w/p.h) - ratio);
      if(d<bestDiff){ bestDiff=d; best=p; }
    }
    return best;
  }

  const elastic = { active:false, center:{x:0,y:0}, targetW:640, targetH:360 };

  function resize(){
    W = window.innerWidth; H = window.innerHeight;

    // happens to be the first time this runs, and never touched again.
    // It's just a stable reference point (its center is where every
    // scene's frame gets centered on) — it does NOT bound where ink can
    // be drawn or how far the canvas can pan/zoom, so there's no upside
    // to keeping it "in sync" with the window, and a real downside: every
    // previously-drawn stroke is stored in absolute coordinates and never
    // moves on its own, so re-anchoring this reference point on every
    // resize would silently drag the frame (and the tools that follow it)
    // away from ink that rightfully hasn't gone anywhere.

      // yet to clobber.
      panY = -effectiveBias();

    // used to unconditionally allocate CW=W*2.4 / CH=H*2.4 (UNCAPPED) on
    // every load and every browser resize, across all 9 canvases below —
    // on a large or HiDPI display that's a multi-gigabyte allocation
    // (e.g. roughly 1.7GB total at 1920x1080 @2x DPR, considerably more

    canvasOriginX = 0; canvasOriginY = 0; CW = 0; CH = 0;

    scenes.forEach(sc=>{

    // definition) — this comment stays here as a pointer for anyone who
    // remembers the old two-call pattern and comes looking for why a

  }

  // reach. Returns true if it actually resized (caller must then redraw).
  const COVERAGE_MARGIN = 400, COVERAGE_PAD = 600;

  // zoomed out the camera gets. Without this, ensureCanvasCoverage()
  // sizes the bitmap to match however much world-space is visible on
  // screen — which grows without bound as viewZoom shrinks (e.g. at
  // 0.05x on a 1280px-wide view, that's 25,000+ px of canvas before
  // padding, on EACH of three layers). Measured a 16-second load/freeze
  // hitting this on an extreme viewport before adding the cap. Ink
  // outside the capped area simply won't be covered by the bitmap at
  // such extreme zoom-out — an acceptable tradeoff, since individual
  // strokes are already near-invisible at that scale anyway.
  const MAX_CANVAS_DIM = 3000;
  function ensureCanvasCoverage(){
    const tl = toWorld(0,0), br = toWorld(W,H);

    const minY = Math.min(tl.y,br.y), maxY = Math.max(tl.y,br.y);

      return false;
    }
    canvasOriginX = minX - COVERAGE_PAD;
    canvasOriginY = minY - COVERAGE_PAD;

    focusRing.style.top = (r.top - sr.top)+'px';

  const BLACK_OPTS = erase => ({color:'rgba(30,28,24,.88)', width: erase?16:2.2, erase});
  const WHITE_OPTS = erase => ({color:'rgba(255,255,255,.5)', width: erase?16:1.6, erase});

    return pt.x>=r.x && pt.x<=r.x+r.w && pt.y>=r.y && pt.y<=r.y+r.h;
  }

  // redraws both layers from scratch. This is what makes previously-hidden
  // (white) ink turn black in real time as the window edge sweeps over it,
  // and vice versa — the classification is purely a render-time concern.
  // Split from renderAll() below so a high-frequency caller (the move-ink

  // small tile-local space instead and so keep their own copy of this

  function classifyAndStroke(segs, r, blackCtx, whiteCtx){

  // incrementally, while a stroke is in progress. Fully re-classifying it
  // from scratch here (rather than trusting the incremental result) is
  // what makes undo/redo/clear correct: they mutate strokeSegments and
  // then call this to make the pixels match, with no assumption about
  // what was on screen a moment before.
  function renderStrokes(){
    fctx.clearRect(0,0,CW,CH);
    nctx.clearRect(0,0,CW,CH);

  // Flattens every OTHER layer of the active scene (i.e. everything

  // scratch pair FIRST and only THEN copied onto whichever of the two

  // eraser stroke on one layer from eating into a different layer's ink,
  // since destination-out only ever acts on whatever's already on the

  // per-pointermove hot path.
  function renderStaticLayers(){

    const r = frameRect();
    fctxBelow.clearRect(0,0,CW,CH); nctxBelow.clearRect(0,0,CW,CH);
    fctxAbove.clearRect(0,0,CW,CH); nctxAbove.clearRect(0,0,CW,CH);
    sc.layers.forEach((layer,i)=>{
      if(i===sc.activeLayer) return;
      gsfCtx.clearRect(0,0,CW,CH); gsnCtx.clearRect(0,0,CW,CH);
      classifyAndStroke(layer.segments, r, gsfCtx, gsnCtx);
      const targetF = i < sc.activeLayer ? fctxBelow : fctxAbove;
      const targetN = i < sc.activeLayer ? nctxBelow : nctxAbove;
      [[targetF,groupScratchF],[targetN,groupScratchN]].forEach(([dst,src])=>{

        // (see the resize forEach above), and src's backing store is
        // ALREADY at physical DPR resolution — drawing through the DPR
        // transform a second time here would scale it up twice over
        dst.save(); dst.setTransform(1,0,0,1,0,0);
        dst.drawImage(src,0,0);
        dst.restore();
      });

  function renderAll(){
    renderStrokes();
    renderStaticLayers();
    renderFilmstrip();
    renderLayerRail();
  }

  // own comment says it's meant only for rare layer/scene-switch events,
  // "never a per-pointermove hot path" — but that's exactly what both
  // resize gestures were doing to it, plus renderFilmstrip() (rebuilds a
  // canvas thumbnail for EVERY scene) and renderLayerRail() (rebuilds one
  // for every layer in the active scene), every frame, for the gesture's
  // whole duration. Cost scales with total project size (scenes × layers
  // × strokes), so this gets more noticeable the more you've drawn —
  // which matches "gets laggy resizing" rather than a fixed one-time cost.
  // None of those three need to track the gesture frame-by-frame: other
  // scenes' own frames aren't moving (only the one being resized is), and
  // the periphery (other layers, other thumbnails) not updating for the
  // ~0.3s a gesture takes is imperceptible — attention is on the frame
  // border actually moving. So during a live gesture: keep renderStrokes()
  // (active layer only, cheap, needed so the ink you're LOOKING at tracks
  // the frame in real time) at full rate, coalesce the other three to at
  // most once per animation frame regardless of how many events fire
  // within it, and throttle renderStaticLayers further still since it has
  // no live-tracking value at all. Either gesture's own end always forces
  // one final untimed renderAll(), so nothing stays stale once input stops.
  // UPDATE: this throttle used to only be reached from the two gesture
  // handlers that call it explicitly (below). applyView() — which runs
  // on every wheel tick, every corner/format-drag pointermove, and every
  // recenter/elastic animation frame — had its OWN, unthrottled path to
  // the exact same two expensive renders, via positionFilmstrip()/
  // positionLayerRail() calling renderFilmstrip()/renderLayerRail()
  // directly. That was the actual leak: fixed by having those two
  // functions call scheduleHeavyRerender() too (see their own
  // definitions), so every path into a heavy rebuild now goes through

  let heavyRerenderRAF = null, heavyRerenderFrame = 0;
  // Per-scene / per-layer thumbnail bitmap cache: object identity -> a

  // and frame geometry it was last painted at. renderFilmstrip()/
  // renderLayerRail() check this before re-stroking every segment of
  // every layer of every scene — most calls (switching which scene/layer
  // is active, panning, resizing a DIFFERENT scene's frame than the one
  // shown, or the throttled callback above firing mid-gesture) touch no
  // ink and no geometry for most tiles at all, so almost every tile
  // becomes one cheap drawImage() blit instead of a full re-paint. Only
  // a tile whose own scene/layer actually changed pays the real cost.
