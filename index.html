  // even when the frame's ASPECT ratio (and so its tile's pixel size)
  // hasn't changed — ink itself is stored in fixed world coordinates, so
  // resizing the frame window around it is a real visual change these
  // thumbnails must track despite never touching inkVersion.
  const sceneThumbCache = new Map();
  const layerThumbCache = new Map();
  function frameSig(r){ return r.x+'|'+r.y+'|'+r.w+'|'+r.h; }
  // Invalidates the cached thumbnail for whichever scene/layer is
  // CURRENTLY active by bumping the counters the cache above compares
  // against. Call this right after any mutation to strokeSegments (the
  // active layer's own segment list) — draw, undo, redo, clear, or
  // move-ink — so the next render knows this one tile can't be reused.
  function markInkChanged(){
    const sc = scenes[activeScene];
    sc.inkVersion = (sc.inkVersion||0) + 1;
    sc.layers[sc.activeLayer].inkVersion = (sc.layers[sc.activeLayer].inkVersion||0) + 1;
  }
  function scheduleHeavyRerender(){
    if(heavyRerenderRAF) return;
    heavyRerenderRAF = requestAnimationFrame(()=>{
      heavyRerenderRAF = null;
      heavyRerenderFrame++;
      renderFilmstrip();
      renderLayerRail();
      if(heavyRerenderFrame % 4 === 0) renderStaticLayers();
    });
  }

  // --- storyboard filmstrip: thumbnails + show/hide on cursor position ---
  const filmstripEl = document.getElementById('filmstrip');
  const filmTrack = document.getElementById('filmTrack');
  // Fixed number of tiles visible across the frame's own width — a
  // deliberate, legible size rather than shrinking tiles to cram more in.
  // Once there are more slots than this (more scenes to add/browse), the
  // strip scrolls sideways instead, with the edges dissolving via the
  // mask in CSS rather than hard-clipping a tile mid-way.
  const VISIBLE_COUNT = 6;
  const FADE_PX = 28;
  function renderFilmstrip(){
    filmTrack.innerHTML = '';
    const GAP = 8;
    const availW = frameBox.getBoundingClientRect().width;
    // tile size is derived ONLY from fitting exactly VISIBLE_COUNT tiles
    // across the frame's width — it no longer shrinks just because more
    // scenes exist; extra slots scroll instead of squeezing everyone in
    let tw = (availW - GAP*(VISIBLE_COUNT-1)) / VISIBLE_COUNT;
    tw = Math.max(34, Math.min(140, tw));
    // fits a tile of the given aspect ratio within (maxW x MAX_TILE_H),
    // shrinking its WIDTH (never its height) once that cap is hit — a
    // portrait scene's tile gets narrower rather than taller, so it can
    // never push the tray itself below the visible viewport regardless of
    // how extreme that scene's own format is
    const fitTile = aspect => {
      let w = tw, h = w/aspect;
      if(h > MAX_TILE_H){ h = MAX_TILE_H; w = h*aspect; }
      return { w, h };
    };
    // "+" add-slot tiles don't belong to any particular scene, so they
    // fall back to the currently active shot's own aspect for sizing
    const addTile = fitTile(frame.w/frame.h);
    // total slots: always keep room for every real scene PLUS at least
    // one empty "add" slot in front of the first and behind the last, so
    // it's always possible to grow the storyboard either direction — this
    // can exceed VISIBLE_COUNT, in which case the row scrolls
    const count = Math.max(VISIBLE_COUNT, scenes.length+2);
    // where the block of real, drawn scenes sits within the row. Fixed at 1
    // (a single leading "add" slot) rather than recentered every render —
    // recentering used to shift the whole block sideways each time a scene
    // was added/removed, which read as the filmstrip jittering left.
    // Growth now only adds/removes slots at the trailing edge, so existing
    // tiles never move.
    const sceneStart = 1;

    // Fade should reflect whether `count` slots actually overflow availW,
    // not just whether count>VISIBLE_COUNT — those aren't the same thing.
    // Tiles aren't uniform width here (each scene keeps its own aspect
    // ratio via fitTile above), so — unlike the layer rail's same-size
    // circles — the real total can't be derived from a single tw; each
    // slot's actual width is summed instead, mirroring the same
    // sceneIdx/sceneStart lookup the render loop below uses, so this stays
    // consistent with whatever actually gets drawn.
    let contentW = 0;
    for(let i=0; i<count; i++){
      const sceneIdx = i - sceneStart;
      const sc = (sceneIdx>=0 && sceneIdx<scenes.length) ? scenes[sceneIdx] : null;
      contentW += sc ? fitTile(sc.frame.w/sc.frame.h).w : addTile.w;
    }
    contentW += GAP*(count-1);
    filmTrack.style.setProperty('--fade', (contentW > availW + 0.5 ? FADE_PX : 0)+'px');

    let activeEl = null;
    for(let i=0; i<count; i++){
      const sceneIdx = i - sceneStart;
      if(sceneIdx>=0 && sceneIdx<scenes.length){
        const sc = scenes[sceneIdx];
        // map through THIS scene's own window, never the active one's —
        // otherwise resizing/reformatting one panel would visibly distort
        // every other panel's thumbnail too
        const r = sc.frame;
        const { w:tileW, h:tileH } = fitTile(r.w/r.h);
        const thumb = document.createElement('canvas');
        thumb.className = 'filmThumb' + (sceneIdx===activeScene ? ' active' : '');
        thumb.width = tileW*2; thumb.height = tileH*2;
        thumb.style.width = tileW+'px'; thumb.style.height = tileH+'px';
        const pxW = thumb.width, pxH = thumb.height; // browser-coerced integer size, used as the cache key
        const sig = frameSig(r);

        // The re-stroke-every-segment-of-every-layer work below is the
        // expensive part — skip it whenever this scene's ink, this
        // tile's pixel size, and this scene's frame geometry are all
        // unchanged since the last time it was painted, and just blit
        // the cached bitmap instead. On a typical render (switching
        // scenes, panning, resizing a DIFFERENT scene's frame) only the
        // scene actually being edited misses the cache.
        let cache = sceneThumbCache.get(sc);
        if(!cache || cache.version!==sc.inkVersion || cache.w!==pxW || cache.h!==pxH || cache.sig!==sig){
          if(!cache){ cache = { canvas: document.createElement('canvas') }; sceneThumbCache.set(sc, cache); }
          cache.canvas.width = pxW; cache.canvas.height = pxH;
          cache.w = pxW; cache.h = pxH; cache.version = sc.inkVersion; cache.sig = sig;
          const tctx = cache.canvas.getContext('2d');
          tctx.scale(2,2);
          tctx.fillStyle = '#f4f2ee';
          tctx.fillRect(0,0,tileW,tileH);
          const map = pt => ({ x:(pt.x-r.x)/r.w*tileW, y:(pt.y-r.y)/r.h*tileH });
          // scale stroke width by the SAME factor as the geometry, so the
          // thumbnail reflects the real drawing's actual proportions rather
          // than a fixed pixel width that reads as disproportionately bold
          // once a shot is shrunk down a lot (e.g. a small tile sitting
          // next to a much bigger active one) — matches BLACK_OPTS' real
          // on-canvas widths (2.2 normal / 16 erase), just scaled down.
          // Floored so a very small tile's line doesn't fade to invisible.
          const thumbScale = tileW / r.w;
          const paintLayer = (segs, ctx) => segs.forEach(seg=>{
            const aIn = inFrameRect(seg.a,r), bIn = inFrameRect(seg.b,r);
            if(!aIn && !bIn) return;
            let a=seg.a, b=seg.b;
            if(!(aIn && bIn)){
              const exit = aIn ? rectExit(a,b,r) : rectExit(b,a,r);
              if(aIn) b = exit; else a = exit;
            }
            const ma = map(a), mb = map(b);
            ctx.save();
            if(seg.erase) ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(30,28,24,.88)';
            ctx.lineWidth = Math.max(0.4, (seg.erase ? 16 : 2.2) * thumbScale);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(ma.x,ma.y); ctx.lineTo(mb.x,mb.y);
            ctx.stroke();
            ctx.restore();
          });
          // paint every layer in stacking order, each isolated on a small
          // reused scratch tile first and only then flattened onto the
          // cached bitmap — same reasoning as renderStaticLayers() above:
          // without this, an eraser stroke on one layer could eat into a
          // different layer's ink the moment they share one bitmap.
          const tileScratch = document.createElement('canvas');
          tileScratch.width = pxW; tileScratch.height = pxH;
          const scCtx = tileScratch.getContext('2d');
          scCtx.scale(2,2);
          sc.layers.forEach(layer=>{
            scCtx.clearRect(0,0,tileW,tileH);
            paintLayer(layer.segments, scCtx);
            tctx.save(); tctx.setTransform(1,0,0,1,0,0);
            tctx.drawImage(tileScratch,0,0);
            tctx.restore();
          });
        }
        thumb.getContext('2d').drawImage(cache.canvas, 0, 0);
        thumb.title = 'Кадр ' + (sceneIdx+1);
        thumb.addEventListener('pointerdown', ev=>{ ev.stopPropagation(); switchScene(sceneIdx); });
        filmTrack.appendChild(thumb);
        if(sceneIdx===activeScene) activeEl = thumb;
      } else {
        // empty slot: in front of the real block -> prepend a new scene
        // before the first one; behind it -> append a new scene after
        // the last one. Both are otherwise identical dashed "+" tiles.
        const addBtn = document.createElement('div');
        addBtn.className = 'filmAdd';
        addBtn.style.width = addTile.w+'px'; addBtn.style.height = addTile.h+'px';
        addBtn.textContent = '+';
        const isFront = sceneIdx<0;
        addBtn.title = isFront ? 'Новый кадр (в начало)' : 'Новый кадр';
        addBtn.addEventListener('pointerdown', ev=>{
          ev.stopPropagation();
          if(isFront) prependScene(); else addScene();
        });
        filmTrack.appendChild(addBtn);
      }
    }
    // keep the active tile in view (no-op if it's already fully visible).
    // NOTE: deliberately NOT using activeEl.scrollIntoView() here — when
    // filmTrack alone can't satisfy inline centering (not enough scroll
    // room), the browser's ancestor walk falls through to #stage (which
    // has overflow:hidden, but is still a legal scroll target per spec)
    // and scrolls IT instead, dragging the whole canvas/toolbar/zoom UI
    // sideways with it. Computing scrollLeft by hand keeps the effect
    // strictly local to the strip, no matter how little room it has.
    if(activeEl){
      const target = activeEl.offsetLeft + activeEl.offsetWidth/2 - filmTrack.clientWidth/2;
      const maxScroll = filmTrack.scrollWidth - filmTrack.clientWidth;
      filmTrack.scrollLeft = Math.max(0, Math.min(target, maxScroll));
    }
  }

  // reveal the tray once the cursor drops below the drawing window's own
  // screen rect (or is already resting over the tray itself); hide it again
  // after a short grace delay so crossing the gap between window and tray
  // doesn't flicker it off
  let filmVisible = false, filmHideTimer = null;
  function updateFilmstripVisibility(clientX, clientY, target){
    const overTray = !!(target && target.closest && target.closest('#filmstrip'));
    const r = frameBox.getBoundingClientRect();
    const belowFrame = clientY > r.bottom - 8 && clientX > r.left - 40 && clientX < r.right + 40;
    const show = overTray || belowFrame;
    if(show){
      if(filmHideTimer){ clearTimeout(filmHideTimer); filmHideTimer = null; }
      if(!filmVisible){ filmVisible = true; filmstripEl.classList.add('visible'); }
    } else if(filmVisible && !filmHideTimer){
      filmHideTimer = setTimeout(()=>{
        filmVisible = false; filmstripEl.classList.remove('visible'); filmHideTimer = null;
      }, 300);
    }
  }
  // anchors the tray directly under the drawing window's live on-screen
  // rect (same trick as syncHandles/focusRing) so it stays magnetized to
  // the canvas through pan/zoom/resize instead of sitting at a fixed
  // viewport position
  function positionFilmstrip(){
    const r = frameBox.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    filmstripEl.style.left = (r.left - sr.left) + 'px';
    filmstripEl.style.top = (r.bottom - sr.top + TRAY_GAP) + 'px';
    filmstripEl.style.width = r.width + 'px';
    // Content rebuild goes through the same rAF-coalesced path as every
    // other camera-driven update (scheduleHeavyRerender, below) instead
    // of calling renderFilmstrip() directly here. This function is
    // called unconditionally from applyView() on literally every
    // wheel/pointermove/animation-frame tick that touches the camera —
    // calling the full (DOM-churning, O(all scenes' ink)) rebuild here
    // directly was exactly the gap that let it fire at full event rate
    // regardless of the throttle scheduleHeavyRerender() was built to
    // provide (see its own comment below). Positioning the tray element
    // itself, above, still happens every time — only the expensive
    // repaint of its contents is now coalesced.
    scheduleHeavyRerender();
  }

  // --- layer rail: circles + show/hide on cursor position, right of frame ---
  // Same appear-on-hover / scroll-with-fade mechanic as the filmstrip
  // above, rotated 90°, and the SAME asymmetric leading/trailing layout
  // too: one FIXED "add above" circle at the very top (never padded,
  // mirrors the filmstrip's own sceneStart=1), the real layers right
  // under it in real stacking order (highest index nearest the top, so
  // the topmost layer sits right below that one circle, near the top of
  // the rail — not centered), and every remaining slot is "add below",
  // stretching down to fill the rail the same way the filmstrip's
  // append side grows. The one real difference from the filmstrip,
  // per the brief: circles are a FIXED shape (not reshaped per scene's
  // aspect, since every layer already shares its one scene's own frame).
  const layerRailEl = document.getElementById('layerRail');
  const layerTrack = document.getElementById('layerTrack');
  const VISIBLE_COUNT_LAYERS = 5;
  const LAYER_FADE_PX = 24;
  function renderLayerRail(){
    layerTrack.innerHTML = '';
    const GAP = 8;
    const availH = frameBox.getBoundingClientRect().height;
    const sc = scenes[activeScene];
    // The rail's normal circle size isn't a guess — it's exactly what the
    // OLD per-height formula used to compute LIVE, evaluated once at this
    // app's own canonical default project: a fresh 640×360 scene on-screen
    // at 100% zoom, i.e. frame.h*viewZoom === 360 (see FIT_REF above).
    // Derived from GAP/VISIBLE_COUNT_LAYERS right here (not copied as
    // separate magic numbers elsewhere) so it can't silently drift out of
    // sync if either constant ever changes.
    const LAYER_D = (360 - GAP*(VISIBLE_COUNT_LAYERS-1)) / VISIBLE_COUNT_LAYERS; // 65.6
    // how many slots we WANT visible at the rail's normal fixed size —
    // pad up to VISIBLE_COUNT_LAYERS when there are few real layers, so
    // the rail doesn't look sparse. This target doesn't depend on availH.
    const wantCount = Math.max(VISIBLE_COUNT_LAYERS, sc.layers.length+2);
    let td = LAYER_D; // fixed size, unless the shrink branch below kicks in
    let count = wantCount;
    const neededForWant = wantCount*td + (wantCount-1)*GAP;
    if(availH >= neededForWant){
      // room to spare beyond what wantCount needs at the fixed size — GROW
      // the count (more add-slots) rather than the circles, to use up the
      // slack. This is the tall/portrait-frame case from the original ask.
      const fitCount = Math.floor((availH+GAP)/(td+GAP));
      count = Math.max(wantCount, fitCount);
    } else {
      // NOT enough height for wantCount circles at the fixed size — the
      // short/very-wide-frame case (e.g. 2.39:1). Previously td stayed
      // fixed here and the rail's own overflow silently cropped the last
      // circle. Instead, shrink every circle just enough that all
      // wantCount of them fit with nothing cut off or hanging past the
      // edge (floored at LAYER_D_MIN; past that the rail falls back to
      // its existing scroll + fade, same as the filmstrip uses).
      td = Math.max(LAYER_D_MIN, (availH - GAP*(wantCount-1)) / wantCount);
    }
    // Exactly mirrors the filmstrip's own sceneStart=1 approach: ONE
    // fixed leading "add" slot (here: add-above) and never more, so the
    // first real layer always sits right under it near the top of the
    // TRACK — not centered, not pushed down by symmetric padding, WITHIN
    // the track's own contents. All padding needed to keep the row
    // looking full (out to VISIBLE_COUNT_LAYERS when there aren't enough
    // real layers on their own) goes to the TRAILING end instead, same as
    // the filmstrip's own append side — so "add below" is what stretches
    // toward the bottom edge, never "add above".
    // Separately, note #layerRail (the outer element, not this track) is
    // `justify-content:center` in CSS — so whenever count/td leave any
    // slack versus availH (routine: the GROW branch above deliberately
    // stops at most one slot short of filling it), the track as a WHOLE
    // sits centered with equal gaps above the first circle and below the
    // last, rather than pinned flush to the top. That's expected, not a
    // bug — just easy to mistake for one when eyeballing a screenshot.
    const aboveSlots = 1;
    // fade is a "there's more, scroll for it" hint — it should reflect
    // whether the circles actually overflow the rail's real height, not
    // whether we grew past the wantCount baseline. Growing (the branch
    // above) is deliberately computed so everything still fits — a taller
    // frame legitimately ending up with 6, 8, however many circles is not
    // overflow, so it must not fade. Only the rare case where even
    // LAYER_D_MIN couldn't shrink enough (see the else branch above)
    // produces genuine overflow, and that's what this should catch.
    const contentH = count*td + (count-1)*GAP;
    layerTrack.style.setProperty('--fade', (contentH > availH + 0.5 ? LAYER_FADE_PX : 0)+'px');
    const r = frame; // every layer in this scene shares this one frame
    const sig = frameSig(r);
    let activeEl = null;
    for(let i=0;i<count;i++){
      if(i<aboveSlots || i>=aboveSlots+sc.layers.length){
        const above = i<aboveSlots;
        const addBtn = document.createElement('div');
        addBtn.className = 'layerAdd';
        addBtn.style.width = td+'px'; addBtn.style.height = td+'px';
        addBtn.textContent = '+';
        addBtn.title = above ? 'Новый слой выше' : 'Новый слой ниже';
        addBtn.addEventListener('pointerdown', ev=>{
          ev.stopPropagation();
          if(above) addLayerAbove(); else addLayerBelow();
        });
        layerTrack.appendChild(addBtn);
        continue;
      }
      // first real-layer slot (right under the above-pool) shows the
      // TOPMOST real layer (highest index); the last one (right above
      // the below-pool) shows the BOTTOMMOST (index 0) — i.e. rail
      // position mirrors array index, since the rail reads visually
      // top-to-bottom but the array is indexed bottom-to-top (see
      // addLayerAbove/Below's note)
      const layerIdx = sc.layers.length - 1 - (i - aboveSlots);
      const layer = sc.layers[layerIdx];
      const thumb = document.createElement('canvas');
      thumb.className = 'layerThumb' + (layerIdx===sc.activeLayer ? ' active' : '');
      thumb.width = td*2; thumb.height = td*2;
      thumb.style.width = td+'px'; thumb.style.height = td+'px';
      const pxD = thumb.width; // browser-coerced integer size, used as the cache key

      // same idea as the filmstrip's own cache above: skip re-stroking
      // this one layer's segments unless its ink, this circle's pixel
      // size, or the shared frame's geometry actually changed since the
      // last time it was painted.
      let cache = layerThumbCache.get(layer);
      if(!cache || cache.version!==layer.inkVersion || cache.d!==pxD || cache.sig!==sig){
        if(!cache){ cache = { canvas: document.createElement('canvas') }; layerThumbCache.set(layer, cache); }
        cache.canvas.width = pxD; cache.canvas.height = pxD;
        cache.d = pxD; cache.version = layer.inkVersion; cache.sig = sig;
        const tctx = cache.canvas.getContext('2d');
        tctx.scale(2,2);
        // circular clip so content beyond the circle — necessarily
        // present for any frame that isn't itself square, since the
        // circle is a fixed shape unlike the filmstrip's per-scene
        // aspect tiles — is cropped rather than squeezed to fit
        tctx.save();
        tctx.beginPath();
        tctx.arc(td/2, td/2, td/2, 0, Math.PI*2);
        tctx.clip();
        tctx.fillStyle = '#f4f2ee';
        tctx.fillRect(0,0,td,td);
        // "cover" style crop, centered: the frame's SHORTER side exactly
        // matches the circle's diameter, its longer side overflows past
        // the circle edge and simply gets clipped — same idea as CSS
        // background-size:cover, just done by hand for a canvas
        const scale = td / Math.min(r.w, r.h);
        const offX = (td - r.w*scale)/2, offY = (td - r.h*scale)/2;
        const map = pt => ({ x:(pt.x-r.x)*scale + offX, y:(pt.y-r.y)*scale + offY });
        // this circle shows ONLY its own layer's ink, never composited
        // with any other layer — unlike the scene filmstrip thumbnail
        // below the frame, which deliberately shows the whole picture.
        // A single layer's own segments can never contain a stray
        // destination-out that reaches outside itself, so no scratch/
        // isolate step is needed here the way renderStaticLayers() and
        // the scene thumbnail above both need one.
        layer.segments.forEach(seg=>{
          const aIn = inFrameRect(seg.a,r), bIn = inFrameRect(seg.b,r);
          if(!aIn && !bIn) return;
          let a=seg.a, b=seg.b;
          if(!(aIn && bIn)){
            const exit = aIn ? rectExit(a,b,r) : rectExit(b,a,r);
            if(aIn) b = exit; else a = exit;
          }
          const ma = map(a), mb = map(b);
          tctx.save();
          if(seg.erase) tctx.globalCompositeOperation = 'destination-out';
          tctx.strokeStyle = 'rgba(30,28,24,.88)';
          tctx.lineWidth = Math.max(0.4, (seg.erase ? 16 : 2.2) * scale);
          tctx.lineCap = 'round';
          tctx.beginPath();
          tctx.moveTo(ma.x,ma.y); tctx.lineTo(mb.x,mb.y);
          tctx.stroke();
          tctx.restore();
        });
        tctx.restore(); // pop the circular clip
      }
      thumb.getContext('2d').drawImage(cache.canvas, 0, 0);
      thumb.title = 'Слой ' + (layerIdx+1);
      thumb.addEventListener('pointerdown', ev=>{ ev.stopPropagation(); switchLayer(layerIdx); });
      layerTrack.appendChild(thumb);
      if(layerIdx===sc.activeLayer) activeEl = thumb;
    }
    // same hand-computed scroll as the filmstrip's own note above, for
    // the same reason: scrollIntoView() here risks scrolling #stage
    // itself instead of just this rail when the rail has little slack.
    if(activeEl){
      const target = activeEl.offsetTop + activeEl.offsetHeight/2 - layerTrack.clientHeight/2;
      const maxScroll = layerTrack.scrollHeight - layerTrack.clientHeight;
      layerTrack.scrollTop = Math.max(0, Math.min(target, maxScroll));
    }
  }
  // reveal the rail once the cursor crosses to the right of the drawing
  // window's own screen rect (or is already resting over the rail
  // itself); hide it again after a short grace delay — identical logic
  // to updateFilmstripVisibility(), just checking the right edge instead
  // of the bottom one.
  let railVisible = false, railHideTimer = null;
  function updateLayerRailVisibility(clientX, clientY, target){
    const overRail = !!(target && target.closest && target.closest('#layerRail'));
    const r = frameBox.getBoundingClientRect();
    const rightOfFrame = clientX > r.right - 8 && clientY > r.top - 40 && clientY < r.bottom + 40;
    const show = overRail || rightOfFrame;
    if(show){
      if(railHideTimer){ clearTimeout(railHideTimer); railHideTimer = null; }
      if(!railVisible){ railVisible = true; layerRailEl.classList.add('visible'); }
    } else if(railVisible && !railHideTimer){
      railHideTimer = setTimeout(()=>{
        railVisible = false; layerRailEl.classList.remove('visible'); railHideTimer = null;
      }, 300);
    }
  }
  // anchors the rail directly right of the drawing window's live
  // on-screen rect, same trick as positionFilmstrip()
  function positionLayerRail(){
    const r = frameBox.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    layerRailEl.style.left = (r.right - sr.left + RAIL_GAP) + 'px';
    layerRailEl.style.top = (r.top - sr.top) + 'px';
    layerRailEl.style.height = r.height + 'px';
    // see positionFilmstrip()'s own comment just above — same fix, same
    // reason: only the (cheap) position tracks the camera every tick,
    // the (expensive) content rebuild is coalesced via scheduleHeavyRerender().
    scheduleHeavyRerender();
  }
  function positionFrame(){
    const r = frameRect();
    updateCornerRadius();
    // Captured once here and handed to applyView() below instead of
    // letting it call ensureCanvasCoverage() a second time — positionFrame()
    // always runs straight into applyView() within the same synchronous
    // call, so the answer can't have changed in between, and this call
    // isn't free (world.getBoundingClientRect() twice, plus a full
    // (capped) canvas realloc + renderAll() on the rarer branch where
    // coverage actually needs to grow).
    const coverageChanged = ensureCanvasCoverage();
    updateClipPath();
    frameBox.style.left = r.x+'px';
    frameBox.style.top = r.y+'px';
    frameBox.style.width = r.w+'px';
    frameBox.style.height = r.h+'px';
    // every caller of positionFrame() needs applyView() right after it
    // anyway (even a frame-shape change still moves where things render
    // on screen) — folding it in here means updateFocus/syncHandles/
    // positionFilmstrip (which re-scans every visible scene's ink) each
    // run once per call instead of twice, and removes the old trap of
    // needing to remember to call both together.
    applyView(coverageChanged);
  }
  // ratioTag lives outside #world (see markup), so its own size (font,
  // padding, border-radius) stays fixed on screen regardless of camera
  // zoom — same trick as focusRing/handles. Position is derived from
  // frameBox's live screen rect, anchored just above its top-left corner.
  function positionRatioTag(){
    const r = frameBox.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    ratioTag.style.left = (r.left - sr.left - 4)+'px';
    ratioTag.style.top = (r.top - sr.top - 30)+'px';
  }
  // handles live outside #world (see markup), so their on-screen size
  // stays fixed regardless of camera zoom — same trick as focusRing.
  // Position is derived from frameBox's live screen rect each time.
  function syncHandles(){
    const r = frameBox.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    const corners = { tl:[r.left,r.top], tr:[r.right,r.top], bl:[r.left,r.bottom], br:[r.right,r.bottom] };
    Object.keys(corners).forEach(c=>{
      const el = document.querySelector('.handleZone.'+c);
      el.style.left = (corners[c][0]-sr.left)+'px';
      el.style.top = (corners[c][1]-sr.top)+'px';
    });
  }

  function strokeSeg(ctx, a, b, opts){
    ctx.save();
    if(opts.erase){ ctx.globalCompositeOperation = 'destination-out'; }
    ctx.strokeStyle = opts.color;
    ctx.lineWidth = opts.width;
    ctx.lineCap = 'round'; ctx.lineJoin='round';
    ctx.shadowColor = opts.glow || 'transparent';
    ctx.shadowBlur = opts.blur || 0;
    ctx.beginPath();
    ctx.moveTo(a.x-canvasOriginX,a.y-canvasOriginY); ctx.lineTo(b.x-canvasOriginX,b.y-canvasOriginY);
    ctx.stroke();
    ctx.restore();
  }

  // point where segment (inside -> outside) exits the rectangle, used to
  // cut a crossing stroke exactly at the frame edge
  function rectExit(insidePt, outsidePt, r){
    const left=r.x, right=r.x+r.w, top=r.y, bottom=r.y+r.h;
    const dx = outsidePt.x-insidePt.x, dy = outsidePt.y-insidePt.y;
    let tmin=0, tmax=1;
    if(dx!==0){
      const tx1=(left-insidePt.x)/dx, tx2=(right-insidePt.x)/dx;
      tmin=Math.max(tmin, Math.min(tx1,tx2)); tmax=Math.min(tmax, Math.max(tx1,tx2));
    }
    if(dy!==0){
      const ty1=(top-insidePt.y)/dy, ty2=(bottom-insidePt.y)/dy;
      tmin=Math.max(tmin, Math.min(ty1,ty2)); tmax=Math.min(tmax, Math.max(ty1,ty2));
    }
    return { x: insidePt.x + tmax*dx, y: insidePt.y + tmax*dy };
  }

  // The stroke stays whole in the data model — only the immediate visual
  // feedback splits it at the current window edge, mirroring renderAll()'s
  // per-frame classification instead of baking the split into the data.
  // Shifts every point of the active layer's ink by a world-space delta,
  // in place. strokeSegments is always a direct reference to whichever
  // layer is currently active (see loadLayer), so this can never touch
  // any other layer's — or any other scene's — ink; no extra scoping
  // needed. Points are shared by reference between adjacent segments of
  // the same stroke (draw() below links them that way: segment N's .b
  // literally IS segment N+1's .a, not just an equal copy — confirmed
  // empirically, not just by reading the code), so a naive per-segment
  // += would double-shift every interior point of a multi-segment
  // stroke. The seen-set visits each distinct point object exactly once
  // regardless of how many segments reference it.
  // NOTE: intentionally NOT recorded in history/future — undo/redo here is
  // scoped to drawing (stroke) and clear actions only, per spec. Segment
  // objects are shared by reference with any history/future entries that
  // point at them, so a move silently carries those points along too;
  // that's accepted as out of scope rather than solved.
  function translateInk(dx, dy){
    const seen = new Set();
    strokeSegments.forEach(seg=>{
      if(!seen.has(seg.a)){ seg.a.x+=dx; seg.a.y+=dy; seen.add(seg.a); }
      if(!seen.has(seg.b)){ seg.b.x+=dx; seg.b.y+=dy; seen.add(seg.b); }
    });
  }

  // --- undo/redo -------------------------------------------------------
  // One entry = one whole user action: either the list of segments a
  // single pointerdown..pointerup stroke added (type 'stroke'), or the
  // full segment list a Clear wiped out (type 'clear'). Never a lone
  // segment — a multi-segment stroke must undo as one gesture, matching
  // how the user experiences having drawn it.
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  function updateHistoryButtons(){
    undoBtn.disabled = history.length===0;
    redoBtn.disabled = future.length===0;
  }
  // segments collected by the in-progress stroke (between pointerdown and
  // pointerup); flushed into history as one entry on pointerup, discarded
  // if the stroke never actually drew anything (a plain click with no
  // movement, per the brief: "если он ещё не начал рисовать")
  let strokeBuffer = [];
  // Caps undo depth so a long drawing session — which pushes one history
  // entry per completed stroke, indefinitely — doesn't grow `history`
  // (and every segment array it references) without bound for the whole
  // life of the tab. 300 steps is generous for normal sketching; the
  // oldest entry is simply forgotten past that, same as most drawing
  // tools' own undo limits. `future` never needs its own cap: it's
  // cleared on every new stroke/clear and can never hold more than
  // however many entries were just undone, which this already bounds.
  const HISTORY_CAP = 300;
  function pushHistory(list, entry){
    list.push(entry);
    if(list.length > HISTORY_CAP) list.shift();
  }
  function commitStroke(){
    if(strokeBuffer.length){
      pushHistory(history, { type:'stroke', segs: strokeBuffer });
      future.length = 0; // any redo chain is invalidated by a new action
      strokeBuffer = [];
      updateHistoryButtons();
      markInkChanged();
    }
  }
  function pushClearHistory(removed){
    if(!removed.length) return;
    pushHistory(history, { type:'clear', segs: removed });
    future.length = 0;
    updateHistoryButtons();
  }
  function undo(){
    if(!history.length) return;
    const entry = history.pop();
    if(entry.type==='stroke'){
      // segments were appended contiguously as one stroke, so the last
      // N entries of strokeSegments are exactly this stroke's own — pop
      // them back off rather than searching/splicing by identity
      strokeSegments.length -= entry.segs.length;
    } else { // 'clear': restore exactly what was wiped
      strokeSegments.push(...entry.segs);
    }
    future.push(entry);
    markInkChanged();
    renderAll();
    updateHistoryButtons();
  }
  function redo(){
    if(!future.length) return;
    const entry = future.pop();
    if(entry.type==='stroke'){
      strokeSegments.push(...entry.segs);
    } else { // 'clear': wipe again
      strokeSegments.length = 0;
    }
    history.push(entry);
    markInkChanged();
    renderAll();
    updateHistoryButtons();
  }
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  function draw(x,y){
    const p = {x,y};
    if(last){
      const erase = tool==='eraser';
      const seg = { a:last, b:p, erase };
      strokeSegments.push(seg);
      strokeBuffer.push(seg);
      markInkChanged();
      const r = frameRect();
      const aIn = inFrameRect(last, r), bIn = inFrameRect(p, r);
      if(aIn && bIn){
        strokeSeg(fctx, last, p, BLACK_OPTS(erase));
      } else if(!aIn && !bIn){
        strokeSeg(nctx, last, p, WHITE_OPTS(erase));
      } else {
        const exit = aIn ? rectExit(last, p, r) : rectExit(p, last, r);
        const inPt = aIn ? last : p, outPt = aIn ? p : last;
        strokeSeg(fctx, inPt, exit, BLACK_OPTS(erase));
        strokeSeg(nctx, exit, outPt, WHITE_OPTS(erase));
      }
    }
    last = p;
  }

  function toWorld(clientX, clientY){
    const r = world.getBoundingClientRect();
    return { x: (clientX - r.left)/viewZoom, y: (clientY - r.top)/viewZoom };
  }

  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('#toolbar') || e.target.closest('#zoom') || e.target.closest('.handleZone')) return;
    if(!focused && isPointOnFrameScreen(e.clientX, e.clientY)){
      recenterView();
      return; // this click brings the window back; it doesn't draw
    }
    drawing = true; last = null;
    const p = toWorld(e.clientX, e.clientY);
    draw(p.x, p.y);
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e=>{
    lastCX = e.clientX; lastCY = e.clientY; lastTarget = e.target;
    if(!drawing){
      updateHoverAffordance();
      updateFilmstripVisibility(e.clientX, e.clientY, e.target);
      updateLayerRailVisibility(e.clientX, e.clientY, e.target);
      return;
    }
    const p = toWorld(e.clientX, e.clientY);
    draw(p.x, p.y);
  });
  stage.addEventListener('pointerleave', ()=>{
    if(filmVisible && !filmHideTimer){
      filmHideTimer = setTimeout(()=>{ filmVisible=false; filmstripEl.classList.remove('visible'); filmHideTimer=null; }, 300);
    }
    if(railVisible && !railHideTimer){
      railHideTimer = setTimeout(()=>{ railVisible=false; layerRailEl.classList.remove('visible'); railHideTimer=null; }, 300);
    }
  });
  window.addEventListener('pointerup', ()=>{
    drawing=false; last=null;
    commitStroke();
    renderFilmstrip();
    renderLayerRail();
  });

  document.querySelectorAll('#toolbar button[data-tool]').forEach(b=>{
    b.addEventListener('click', ()=>{
      tool = b.dataset.tool;
      document.querySelectorAll('#toolbar button[data-tool]').forEach(x=>x.classList.toggle('active', x===b));
      // the pencil doubles as a "find the window" control: clicking it
      // always recenters the view, whether it was already active or not
      if(b===penBtn) recenterView();
    });
  });
  // Clears the ACTIVE LAYER only, not the whole scene — consistent with
  // pen/eraser/move all being scoped to whichever layer is currently
  // selected. Other layers in this scene are untouched, so there's no
  // need to also call renderStaticLayers() here (nothing it composites
  // has changed) — just the active layer's own two canvases, plus both
  // thumbnail rails that show its content.
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    const removed = strokeSegments.slice();
    strokeSegments.length = 0;
    pushClearHistory(removed);
    markInkChanged();
    renderStrokes(); // clears both canvases via the same from-scratch path everything else uses, rather than a second hand-written clearRect pair that has to be kept in sync by hand
    renderFilmstrip();
    renderLayerRail();
  });

  // Move tool: press-and-hold the button ITSELF, not "select a tool, then
  // drag on the canvas" like pen/eraser — deliberately, per how this was
  // scoped. Pointer capture stays on the button for the whole gesture
  // (same setPointerCapture-on-source-element + window-level move/up
  // pattern as the resize handles below), so the cursor never has to
  // reach the canvas and can wander anywhere on screen once the gesture
  // has started — only the frame-to-frame movement delta is used, so the
  // cursor is hidden for the duration (html.moving-ink in the CSS) rather
  // than left pointing at a screen position that's disconnected from
  // what's actually happening. frame/zoom/pan are never touched here —
  // only this scene's own ink shifts (translateInk), which is what
  // re-sorts each stroke black/white against the unmoving frame edge for
  // free, via renderStrokes()'s existing in/out classification.
  const moveBtn = document.getElementById('moveBtn');
  moveBtn.addEventListener('pointerdown', e=>{
    e.preventDefault();
    // Deliberately does NOT auto-recenter and proceed — that would move
    // the camera as a surprise side effect of a press meant to move ink,
    // and the user would be dragging blind for however long the spring-
    // back animation takes. Simpler and more honest to just refuse: red
    // glow on the button itself (not the window's own on-screen rect —
    // the whole point is this has to work even when that's nowhere the
    // user can see), no movement, no capture — the user recenters on
    // purpose (e.g. via the pen button, which already does this) and
    // then tries again once they can actually see what they're moving.
    if(!isFocused()){
      moveBtn.classList.add('blocked');
      const unblock = ()=>{
        moveBtn.classList.remove('blocked');
        window.removeEventListener('pointerup', unblock);
        window.removeEventListener('pointercancel', unblock);
      };
      window.addEventListener('pointerup', unblock);
      window.addEventListener('pointercancel', unblock);
      return;
    }
    moveBtn.setPointerCapture(e.pointerId);
    moveBtn.classList.add('active');
    document.documentElement.classList.add('moving-ink');
    let last = { x:e.clientX, y:e.clientY };
    const move = ev=>{
      const dxS = ev.clientX-last.x, dyS = ev.clientY-last.y;
      last = { x:ev.clientX, y:ev.clientY };
      if(!dxS && !dyS) return;
      // live viewZoom, not frozen at gesture start — unlike the corner-
      // resize/format-drag gestures below, this one never changes
      // viewZoom itself, so there's no feedback loop to guard against;
      // using the live value just keeps screen-px-moved matching
      // screen-px-shifted even if zoom happens to change from some
      // unrelated concurrent action mid-drag (e.g. a ctrl+wheel pinch).
      translateInk(dxS/viewZoom, dyS/viewZoom);
      markInkChanged();
      renderStrokes();
    };
    const up = ()=>{
      moveBtn.classList.remove('active');
      document.documentElement.classList.remove('moving-ink');
      renderFilmstrip();
      renderLayerRail();
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });

  function applyView(coverageAlreadyChecked){
    // the label reflects the user's own deliberate zoom relative to this
    // shot's auto-fit baseline (always "100%" right after a switch,
    // however big or small that shot's own window is) rather than the
    // raw effective CSS scale — showing the raw value would make a wide
    // shot read as e.g. "56%" even though its window looks exactly the
    // same size on screen as every other shot's
    zLabel.textContent = Math.round(zoomMultiplier*100)+'%';
    // translate is listed first so it moves the already-scaled element by
    // raw screen pixels — panning feels the same regardless of zoom level
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${viewZoom})`;
    // panning/zooming is normally a free CSS transform (GPU-cheap, no
    // redraw) — only touch the canvas buffer when the visible area is
    // about to outgrow it. positionFrame() already computed this answer
    // by the time it calls applyView() and passes it straight in (see
    // there); it's only actually (re)computed here, with its own
    // getBoundingClientRect() reads, for callers that haven't already
    // checked — the wheel handler, zoom +/- clicks, and the recenter
    // animation's own applyView() call.
    const coverageChanged = coverageAlreadyChecked !== undefined ? coverageAlreadyChecked : ensureCanvasCoverage();
    if(coverageChanged){ updateClipPath(); renderAll(); }
    updateFocus();
    positionRatioTag();
    syncHandles();
    positionFilmstrip();
    positionLayerRail();
  }
  document.getElementById('zIn').addEventListener('click', ()=>{ zoomMultiplier = Math.min(zoomMultiplier*1.15, 4); updateZoom(); applyView(); });
  document.getElementById('zOut').addEventListener('click', ()=>{ zoomMultiplier = Math.max(zoomMultiplier/1.15, 0.25); updateZoom(); applyView(); });
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    if(e.ctrlKey){
      // trackpad pinch gesture is reported as a wheel event with ctrlKey set
      zoomMultiplier = Math.max(0.25, Math.min(4, zoomMultiplier * (e.deltaY<0?1.08:0.92)));
      updateZoom();
    } else {
      // two-finger trackpad pan / mouse-wheel scroll
      panTarget = null; // a manual pan cancels any in-flight recenter animation
      panX -= e.deltaX;
      panY -= e.deltaY;
    }
    applyView();
  }, {passive:false});

  // Two-finger trackpad gestures over the filmstrip should browse frames
  // (scroll the strip) instead of panning the canvas that happens to sit
  // behind/above it. Listened on the tray itself and stopped from
  // bubbling, so #stage's own wheel handler (which pans the world) never
  // sees these events at all.
  filmstripEl.addEventListener('wheel', e=>{
    e.preventDefault();
    e.stopPropagation();
    if(e.ctrlKey) return; // pinch-zoom gesture: just swallow it, no zoom here
    const delta = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    filmTrack.scrollLeft += delta;
  }, {passive:false});

  // Same idea for the layer rail, but simpler: it scrolls VERTICALLY,
  // which is the axis a plain wheel's deltaY already drives natively for
  // any overflow-y:auto element — no manual scrollTop math needed the
  // way the (horizontal) filmstrip above needs scrollLeft math. Only
  // still needed: stop the event from bubbling to #stage's own wheel
  // handler (which pans the canvas behind the rail), and swallow pinch-
  // zoom so it doesn't zoom the canvas while the cursor sits over here.
  layerRailEl.addEventListener('wheel', e=>{
    e.stopPropagation();
    if(e.ctrlKey) e.preventDefault();
  }, {passive:false});

  // every corner except top-left resizes the shot's own window,
  // aspect-preserving, anchored at its center. The window's ON-SCREEN
  // size is kept auto-normalized throughout the drag (see updateZoom),
  // so this always reads as zooming into the drawing itself — the box
  // you see never grows or shrinks, only how much of your ink fits
  // inside it does.
  const RESIZE_CORNERS = { tr:{x:1,y:-1}, bl:{x:-1,y:1}, br:{x:1,y:1} };
  Object.keys(RESIZE_CORNERS).forEach(corner=>{
    const zone = document.querySelector('.handleZone.'+corner);
    const sign = RESIZE_CORNERS[corner];
    zone.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      cornerDragging = true;
      updateHoverAffordance();
      const startX=e.clientX, startY=e.clientY;
      const startW=frame.w, startH=frame.h;
      const aspect = startW/startH;
      const center = { x: frame.x+frame.w/2, y: frame.y+frame.h/2 };
      // frozen for this whole gesture: converting the mouse's screen
      // delta to world units must use a fixed reference, never the live
      // viewZoom — dragging changes frame.w/h, which (via updateZoom)
      // changes viewZoom, so reading the live value here would feed back
      // into itself and make the drag spiral out of control.
      const startZoom = viewZoom;
      const move=(ev)=>{
        const dx=(ev.clientX-startX)/startZoom, dy=(ev.clientY-startY)/startZoom;
        const delta = (dx*sign.x + dy*sign.y)/2;
        const newW = Math.max(120, startW + delta*2);
        frame.w = newW;
        frame.h = newW/aspect;
        frame.x = center.x - frame.w/2;
        frame.y = center.y - frame.h/2;
        updateZoom();
        positionFrame();
        renderStrokes();
        scheduleHeavyRerender();
      };
      const up=(ev)=>{
        cornerDragging=false;
        lastCX=ev.clientX; lastCY=ev.clientY;
        updateHoverAffordance();
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
        renderAll(); // guarantee one full, untimed pass — the gesture may have ended on a throttled/coalesced frame
      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      zone.setPointerCapture(e.pointerId);
    });
  });

  // top-left corner: changes the FORMAT (aspect ratio) to the nearest standard preset,
  // anchored at the fixed bottom-right corner, with a rubbery/elastic catch-up animation
  const tlZone = document.querySelector('.handleZone.tl');
  tlZone.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    cornerDragging = true;
    updateHoverAffordance();
    // anchor on the frame's own center, so the format change is symmetric
    // in both directions instead of pinned to the opposite corner
    const center = { x: frame.x+frame.w/2, y: frame.y+frame.h/2 };
    elastic.center = center;
    elastic.active = true;
    ensureTickRunning();
    ratioTag.style.opacity = '1';
    // fix the area at the size the frame had when the gesture started —
    // this way scale is determined only by which preset is picked, not
    // by how far the cursor is dragged; continuing to drag within the
    // same preset no longer keeps inflating the size
    const area = frame.w * frame.h;
    // frozen reference for interpreting the cursor during this whole
    // gesture — see the resize-corner handler above for why this can't
    // read the live viewZoom once the frame (and so viewZoom) starts
    // changing under the cursor
    const startZoom = viewZoom;
    const wr = world.getBoundingClientRect();
    const toWorldFrozen = (clientX, clientY) => ({ x:(clientX-wr.left)/startZoom, y:(clientY-wr.top)/startZoom });
    const move=(ev)=>{
      const p = toWorldFrozen(ev.clientX, ev.clientY);
      // distance from center, mirrored to both sides -> used only to
      // detect direction/ratio, not to set absolute size
      let rawW = (center.x - p.x)*2, rawH = (center.y - p.y)*2;
      rawW = Math.max(1, rawW); rawH = Math.max(1, rawH);
      const preset = nearestPreset(rawW/rawH);
      const ratio = preset.w/preset.h;
      // derive w/h from the fixed area + chosen preset's ratio
      let targetW = Math.sqrt(area*ratio);
      let targetH = targetW/ratio;
      targetW = Math.max(90, targetW);
      targetH = Math.max(60, targetH);
      elastic.targetW = targetW; elastic.targetH = targetH;
      ratioTag.textContent = preset.label;
    };
    const up=(ev)=>{
      cornerDragging = false;
      lastCX=ev.clientX; lastCY=ev.clientY;
      updateHoverAffordance();
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      // fade the label out once it's basically settled (or stop polling
      // outright if a scene switch already cancelled this gesture — after
      // that, `frame` may refer to a different scene entirely, so this
      // stale target should never be compared against it again)
      const check = setInterval(()=>{
        if(!elastic.active || (Math.abs(frame.w-elastic.targetW)<0.5 && Math.abs(frame.h-elastic.targetH)<0.5)){
          ratioTag.style.opacity='0'; elastic.active=false; clearInterval(check);
          renderAll(); // guarantee one full, untimed pass — elasticTick() throttles the expensive tier while settling
        }
      }, 120);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    tlZone.setPointerCapture(e.pointerId);
  });

  // continuous rubber-band easing loop — shared by the format handle and
  // by "click to recenter" (reusing one animation loop instead of two).
  // Only runs while there's actually something to animate: used to call
  // requestAnimationFrame(elasticTick) unconditionally forever, which
  // meant a rAF callback firing ~60x/sec for the entire life of the tab
  // even when totally idle (the vast majority of a session). Harmless on
  // its own, but there's no reason to pay even that much when idle — see
  // ensureTickRunning() below, called from the two places that actually
  // start an animation (elastic.active=true and panTarget being set).
  let tickRAF = null;
  function ensureTickRunning(){
    if(!tickRAF) tickRAF = requestAnimationFrame(elasticTick);
  }
  function elasticTick(){
    tickRAF = null;
    if(elastic.active){
      frame.w += (elastic.targetW - frame.w)*0.16;
      frame.h += (elastic.targetH - frame.h)*0.16;
      frame.x = elastic.center.x - frame.w/2;
      frame.y = elastic.center.y - frame.h/2;
      updateZoom();
      positionFrame();
      renderStrokes();
      scheduleHeavyRerender();
    }
    if(panTarget){
      // time-based ease-out over a fixed duration: deceleration is spread
      // across the whole move and stays visible, instead of a lerp where
      // most of the distance vanishes in the first frame
      const t = Math.min(1, (performance.now()-panStart)/PAN_DURATION);
      const e = easeDock(t);
      panX = panFrom.x + (panTarget.x-panFrom.x)*e;
      panY = panFrom.y + (panTarget.y-panFrom.y)*e;
      if(t>=1) panTarget = null;
      applyView();
    }
    if(elastic.active || panTarget) tickRAF = requestAnimationFrame(elasticTick);
  }

  // Many browsers fire 'resize' repeatedly while the user is actively
  // dragging the OS window's edge, not just once at the end. resize()
  // now allocates a CAPPED (not multi-gigabyte) canvas buffer, but it's
  // still real allocation + a full renderAll() — no reason to pay that
  // cost on every intermediate frame of the drag instead of once after
  // the user actually settles on a size.
  let resizeDebounceTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeDebounceTimer);
    resizeDebounceTimer = setTimeout(resize, 150);
  });
  resize();
  updateHistoryButtons();
})();
</script>
</body>
</html>
