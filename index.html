  // Active layer only — this is the canvas draw() also paints onto live,
  // incrementally, while a stroke is in progress. Fully re-classifying it
  // from scratch here (rather than trusting the incremental result) is
  // what makes undo/redo/clear correct: they mutate strokeSegments and
  // then call this to make the pixels match, with no assumption about
  // what was on screen a moment before.
  function renderStrokes(){
    fctx.clearRect(0,0,CW,CH);
    nctx.clearRect(0,0,CW,CH);
    const activeLayerObj = scenes[activeScene].layers[scenes[activeScene].activeLayer];
    fctx.globalAlpha = nctx.globalAlpha = activeLayerObj.opacity;
    if(activeLayerObj.type==='image'){
      drawImageLayerClipped(fctx, activeLayerObj, frameRect());
    } else {
      classifyAndStroke(strokeSegments, frameRect(), fctx, nctx);
    }
    fctx.globalAlpha = nctx.globalAlpha = 1;
  }
  // Draws one image layer's picture into ctx, hard-clipped to the frame
  // rect r (canvas-buffer-local coords, i.e. already offset by
  // canvasOriginX/Y same as strokeSeg does) — this is what keeps a photo
  // from ever visually spilling past the shot's own window. Unlike ink,
  // there's no "ghost" treatment for whatever falls outside r: the brief
  // is that the picture simply hides there (non-destructively — ix/iy/
  // iw/ih keep describing its true position/size regardless), not that
  // it gets a dim outside-the-window preview the way strokes do.
  // The clip rect is padded by 1px on every side (same trick as
  // updateClipPath()'s own `bleed`) so THIS clip is never the tightest
  // one in the stack — the outer CSS clip-path on the canvas element
  // itself (already inset+bled the same way) stays the true boundary,
  // avoiding a double-clip seam at the edge.
  function drawImageLayerClipped(ctx, layer, r){
    ctx.save();
    ctx.beginPath();
    ctx.rect(r.x-canvasOriginX-1, r.y-canvasOriginY-1, r.w+2, r.h+2);
    ctx.clip();
    ctx.drawImage(layer.img, layer.ix-canvasOriginX, layer.iy-canvasOriginY, layer.iw, layer.ih);
    ctx.restore();

  // except the one currently live on front/notes) into two composites by
  // real stacking position: frontBelow/notesBelow for every layer with a
  // LOWER index than the active one (painted UNDER front/notes), and
  // frontAbove/notesAbove for every HIGHER-index layer (painted OVER
  // front/notes). Each non-active layer is drawn onto a shared, reused
  // scratch pair FIRST and only THEN copied onto whichever of the two
  // group buffers it belongs to — that isolation is what stops an
  // eraser stroke on one layer from eating into a different layer's ink,
  // since destination-out only ever acts on whatever's already on the
  // SAME bitmap. Only runs when the active layer or scene changes (see
  // switchLayer/switchScene/addLayerAbove/addLayerBelow), never
  // per-stroke — layer switches are rare, deliberate clicks, not a
  // per-pointermove hot path.
  function renderStaticLayers(){
    const sc = scenes[activeScene];
    const r = frameRect();
    fctxBelow.clearRect(0,0,CW,CH); nctxBelow.clearRect(0,0,CW,CH);
    fctxAbove.clearRect(0,0,CW,CH); nctxAbove.clearRect(0,0,CW,CH);
    sc.layers.forEach((layer,i)=>{
      if(i===sc.activeLayer) return;

      } else {

      const targetN = i < sc.activeLayer ? nctxBelow : nctxAbove;
      [[targetF,groupScratchF],[targetN,groupScratchN]].forEach(([dst,src])=>{

        // (see the resize forEach above), and src's backing store is
        // ALREADY at physical DPR resolution — drawing through the DPR

        dst.save(); dst.setTransform(1,0,0,1,0,0);

  function renderAll(){

    // scene/layer switch, undo/redo/clear. Pure pan needs no redraw (the whole
    // buffer, grid included, moves via the CSS transform).
    drawGrid(bctx, viewZoom, panX, panY, CW, CH);

  }
  // Live-resize gestures (the format/elastic handle below, and the free

  // "never a per-pointermove hot path" — but that's exactly what both
  // resize gestures were doing to it, plus renderFilmstrip() (rebuilds a
  // canvas thumbnail for EVERY scene) and renderLayerRail() (rebuilds one
  // for every layer in the active scene), every frame, for the gesture's
  // whole duration. Cost scales with total project size (scenes × layers
  // × strokes), so this gets more noticeable the more you've drawn —
  // which matches "gets laggy resizing" rather than a fixed one-time cost.
  // None of those three need to track the gesture frame-by-frame: other
  // scenes' own frames aren't moving (only the one being resized is), and
  // the periphery (other layers, other thumbnails) not updating for the
  // ~0.3s a gesture takes is imperceptible — attention is on the frame
  // border actually moving. So during a live gesture: keep renderStrokes()
  // (active layer only, cheap, needed so the ink you're LOOKING at tracks
  // the frame in real time) at full rate, coalesce the other three to at
  // most once per animation frame regardless of how many events fire
  // within it, and throttle renderStaticLayers further still since it has
  // no live-tracking value at all. Either gesture's own end always forces
  // one final untimed renderAll(), so nothing stays stale once input stops.
  // UPDATE: this throttle used to only be reached from the two gesture
  // handlers that call it explicitly (below). applyView() — which runs
  // on every wheel tick, every corner/format-drag pointermove, and every
  // recenter/elastic animation frame — had its OWN, unthrottled path to
  // the exact same two expensive renders, via positionFilmstrip()/
  // positionLayerRail() calling renderFilmstrip()/renderLayerRail()
  // directly. That was the actual leak: fixed by having those two
  // functions call scheduleHeavyRerender() too (see their own
  // definitions), so every path into a heavy rebuild now goes through
  // this one coalescing point.
  let heavyRerenderRAF = null, heavyRerenderFrame = 0;
  // Per-scene / per-layer thumbnail bitmap cache: object identity -> a
  // small persistent offscreen canvas, plus the ink-version, pixel size,
  // and frame geometry it was last painted at. renderFilmstrip()/
  // renderLayerRail() check this before re-stroking every segment of
  // every layer of every scene — most calls (switching which scene/layer
  // is active, panning, resizing a DIFFERENT scene's frame than the one
  // shown, or the throttled callback above firing mid-gesture) touch no
  // ink and no geometry for most tiles at all, so almost every tile
  // becomes one cheap drawImage() blit instead of a full re-paint. Only
  // a tile whose own scene/layer actually changed pays the real cost.
  // Three independent triggers invalidate a cached tile: inkVersion
  // (bumped by markInkChanged(), below, and directly in
  // addLayerAbove/Below) catches drawing/undo/redo/clear/move; the
  // pixel-size check catches a sharper redraw being worth it after a
  // window resize; the frame-geometry signature catches a corner/format
  // resize changing what fraction of the frame a given stroke occupies
  // even when the frame's ASPECT ratio (and so its tile's pixel size)
  // hasn't changed — ink itself is stored in fixed world coordinates, so
  // resizing the frame window around it is a real visual change these
  // thumbnails must track despite never touching inkVersion.
  const sceneThumbCache = new Map();
  // WeakMap, not Map: deleteImageLayer() splices a layer object out of
  // sc.layers, but a plain Map would still hold that object forever as a
  // cache key, its own thumbnail canvas included -- a real per-deleted-
  // image-layer leak over a long session. sceneThumbCache just above
  // stays a regular Map on purpose: there's no way to delete a whole
  // scene anywhere in this app, so every key ever inserted there remains
  // legitimately reachable via scenes[] for the tab's entire lifetime
  // regardless.
  const layerThumbCache = new WeakMap();
  function frameSig(r){ return r.x+'|'+r.y+'|'+r.w+'|'+r.h; }
  // Shared by both thumbnail painters (layer rail circle + filmstrip
  // scene tile) for drawing an image layer's own visible (frame-clipped)
  // portion into a small destination canvas. Each caller passes its own
  // `map(pt)` closure -- the rail's circle uses a "cover" crop, the
  // filmstrip's tile uses a plain "contain" fit matching the frame's own
  // aspect -- this function doesn't care which; it just intersects the
  // image's rect with the frame rect r, then maps both corners of that
  // intersection through map() to get the destination rect, and works
  // out the matching SOURCE rect (in the image bitmap's own pixels) via
  // simple proportional math. No-ops if the image doesn't overlap the
  // frame at all (fully dragged out of view).
  function drawImageIntoThumb(ctx, layer, r, map){
    const ix0=Math.max(layer.ix,r.x), iy0=Math.max(layer.iy,r.y);

    if(ix1<=ix0 || iy1<=iy0) return;
    const sx=(ix0-layer.ix)/layer.iw*layer.img.width, sy=(iy0-layer.iy)/layer.ih*layer.img.height;
    const sw=(ix1-ix0)/layer.iw*layer.img.width, sh=(iy1-iy0)/layer.ih*layer.img.height;
    const d0=map({x:ix0,y:iy0}), d1=map({x:ix1,y:iy1});
    ctx.drawImage(layer.img, sx,sy,sw,sh, d0.x,d0.y, d1.x-d0.x, d1.y-d0.y);
  }
  // Invalidates the cached thumbnail for whichever scene/layer is
  // CURRENTLY active by bumping the counters the cache above compares
  // against. Call this right after any mutation to strokeSegments (the
  // active layer's own segment list) — draw, undo, redo, clear, or
  // move-ink — so the next render knows this one tile can't be reused.
  function markInkChanged(){
    const sc = scenes[activeScene];
    sc.inkVersion = (sc.inkVersion||0) + 1;
    sc.layers[sc.activeLayer].inkVersion = (sc.layers[sc.activeLayer].inkVersion||0) + 1;
  }
  function scheduleHeavyRerender(){
    if(heavyRerenderRAF) return;
    heavyRerenderRAF = requestAnimationFrame(()=>{
      heavyRerenderRAF = null;
      heavyRerenderFrame++;
      renderFilmstrip();
      renderLayerRail();
      if(heavyRerenderFrame % 4 === 0) renderStaticLayers();
    });
  }

  // --- storyboard filmstrip: thumbnails + show/hide on cursor position ---
  const filmstripEl = document.getElementById('filmstrip');
  const filmTrack = document.getElementById('filmTrack');
  // Fixed number of tiles visible across the frame's own width — a
  // deliberate, legible size rather than shrinking tiles to cram more in.
  // Once there are more slots than this (more scenes to add/browse), the
  // strip scrolls sideways instead, with the edges dissolving via the
  // mask in CSS rather than hard-clipping a tile mid-way.
  const VISIBLE_COUNT = 6;
  const FADE_PX = 28;
  // shared with computeFilmSlots() below AND the drag-reorder hit-test in
  // beginFilmThumbGesture() further down -- one gap value, so a dragged
  // tile's drop point always lines up with the boundary pass 2 actually
  // draws between two tiles.
  const GAP = 8;
  function renderFilmstrip(){ renderFilmstripWindowed(true); }

  // Off-screen scenes (scrolled out of the visible tray) don't get their
  // thumbnail canvas built at all — only their WIDTH is known (cheap,
  // pure arithmetic from fitTile, no canvas/DOM work), and a single
  // lightweight spacer div stands in for each contiguous run of them so
  // the track's total scrollable width and every visible tile's position
  // stay exactly correct. A generous buffer around the visible viewport
  // (bigger than the fade zone and the widest possible tile) means
  // nothing pops in visibly right at the edge before the window updates.
  // forceScrollToActive=true (the normal entry point, on any content
  // change) snaps the strip to center the active scene, matching the old
  // behavior exactly. forceScrollToActive=false (from the scroll listener
  // below) rebuilds the DOM for whatever's now visible WITHOUT touching
  // scrollLeft, so it doesn't fight the user's own manual scroll/wheel —
  // without this, scrolling the tray to browse other scenes without
  // switching to one would just show empty spacers where their thumbnails
  // should be, since nothing would ever tell the window to follow.
  const FILMSTRIP_WINDOW_BUFFER = 200;
  // Pure geometry: every slot's size and cumulative x-offset within the
  // (unscrolled, unwindowed) track, for scenes[] in its CURRENT order. No
  // canvas/DOM work, so it's cheap to call once a render as well as
  // continuously while a film-drag is live -- beginFilmThumbGesture()
  // further down needs these same x/w numbers to know which slot the
  // pointer is currently sitting over. Kept as its own function
  // specifically so there's exactly one place that knows this layout
  // math: drag hit-testing silently drifting out of sync with what's
  // actually drawn would be a much worse bug than a slightly-off drop
  // target.
  function computeFilmSlots(){
    const availW = getFrameBoxRect().width;
    // tile size is derived ONLY from fitting exactly VISIBLE_COUNT tiles
    // across the frame's width — it no longer shrinks just because more
    // scenes exist; extra slots scroll instead of squeezing everyone in
    let tw = (availW - GAP*(VISIBLE_COUNT-1)) / VISIBLE_COUNT;
    tw = Math.max(34, Math.min(140, tw));
    // fits a tile of the given aspect ratio within (maxW x MAX_TILE_H),
    // shrinking its WIDTH (never its height) once that cap is hit — a
    // portrait scene's tile gets narrower rather than taller, so it can
    // never push the tray itself below the visible viewport regardless of
    // how extreme that scene's own format is
    const fitTile = aspect => {
      let w = tw, h = w/aspect;
      if(h > MAX_TILE_H){ h = MAX_TILE_H; w = h*aspect; }
      return { w, h };
    };
    // "+" add-slot tiles don't belong to any particular scene, so they
    // fall back to the currently active shot's own aspect for sizing
    const addTile = fitTile(frame.w/frame.h);
    // total slots: always keep room for every real scene PLUS at least
    // one empty "add" slot in front of the first and behind the last, so
    // it's always possible to grow the storyboard either direction — this
    // can exceed VISIBLE_COUNT, in which case the row scrolls
    const count = Math.max(VISIBLE_COUNT, scenes.length+2);
    // where the block of real, drawn scenes sits within the row. Fixed at 1
    // (a single leading "add" slot) rather than recentered every render —
    // recentering used to shift the whole block sideways each time a scene
    // was added/removed, which read as the filmstrip jittering left.
    // Growth now only adds/removes slots at the trailing edge, so existing
    // tiles never move.
    const sceneStart = 1;

    // every slot's size and its cumulative x-offset within the track.
    // Pure arithmetic — O(scenes) regardless of how many end up actually
    // visible, which is what makes windowing the expensive part (pass 2,
    // in renderFilmstripWindowed) possible: this has to see everything
    // anyway to know the track's real total width and where each tile
    // WOULD sit, on- or off-screen alike.
    const slots = [];
    let cursorX = 0;
    for(let i=0; i<count; i++){
      const sceneIdx = i - sceneStart;
      const sc = (sceneIdx>=0 && sceneIdx<scenes.length) ? scenes[sceneIdx] : null;
      const sz = sc ? fitTile(sc.frame.w/sc.frame.h) : addTile;
      slots.push({ sceneIdx, sc, x:cursorX, w:sz.w, h:sz.h });
      cursorX += sz.w + GAP;

    const contentW = Math.max(0, cursorX - GAP);
    return { slots, contentW, availW };
  }
  function renderFilmstripWindowed(forceScrollToActive){
    const { slots, contentW, availW } = computeFilmSlots();
    filmTrack.style.setProperty('--fade', (contentW > availW + 0.5 ? FADE_PX : 0)+'px');

    const viewW = filmTrack.clientWidth || availW;
    const maxScroll = Math.max(0, contentW - viewW);
    let scrollPos;
    if(forceScrollToActive){
      const activeSlot = slots.find(s => s.sceneIdx===activeScene);
      // NOTE: deliberately not using activeEl.scrollIntoView() for this —
      // when filmTrack alone can't satisfy inline centering (not enough
      // scroll room), the browser's ancestor walk falls through to #stage
      // (which has overflow:hidden, but is still a legal scroll target
      // per spec) and scrolls IT instead, dragging the whole canvas/

      scrollPos = activeSlot

    // regardless of position — there are only ever two of them, and they
    // have no canvas content to skip painting in the first place.
    const winStart = scrollPos - FILMSTRIP_WINDOW_BUFFER;

  // Builds one slot's real DOM element — a scene's thumbnail canvas (with

      // thumbnail just got darker for some reason". The actual artwork

      thumb.style.width = tileW+'px'; thumb.style.height = tileH+'px';
      const pxW = thumb.width, pxH = thumb.height; // browser-coerced integer size, used as the cache key
      const sig = frameSig(r);

      // expensive part — skip it whenever this scene's ink, this
      // tile's pixel size, and this scene's frame geometry are all
      // unchanged since the last time it was painted, and just blit
      // the cached bitmap instead. On a typical render (switching
      // scenes, panning, resizing a DIFFERENT scene's frame) only the
      // scene actually being edited misses the cache.
      let cache = sceneThumbCache.get(sc);
      if(!cache || cache.version!==sc.inkVersion || cache.w!==pxW || cache.h!==pxH || cache.sig!==sig){
        if(!cache){ cache = { canvas: document.createElement('canvas') }; sceneThumbCache.set(sc, cache); }

        const tctx = cache.canvas.getContext('2d');

        tctx.fillRect(0,0,tileW,tileH);
        const map = pt => ({ x:(pt.x-r.x)/r.w*tileW, y:(pt.y-r.y)/r.h*tileH });
        // scale stroke width by the SAME factor as the geometry, so the
        // thumbnail reflects the real drawing's actual proportions rather
        // than a fixed pixel width that reads as disproportionately bold
        // once a shot is shrunk down a lot (e.g. a small tile sitting
        // next to a much bigger active one) — matches BLACK_OPTS' real
        // on-canvas widths (2.2 normal / 16 erase), just scaled down.
        // Floored so a very small tile's line doesn't fade to invisible.
        const thumbScale = tileW / r.w;
        const paintLayer = (segs, ctx) => segs.forEach(seg=>{
          const aIn = inFrameRect(seg.a,r), bIn = inFrameRect(seg.b,r);
          if(!aIn && !bIn) return;
          let a=seg.a, b=seg.b;
          if(!(aIn && bIn)){
            const exit = aIn ? rectExit(a,b,r) : rectExit(b,a,r);
            if(aIn) b = exit; else a = exit;
          }
          const ma = map(a), mb = map(b);
          ctx.save();
          if(seg.erase) ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(30,28,24,.88)';
          ctx.lineWidth = Math.max(0.4, (seg.erase ? 16 : 2.2) * thumbScale);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(ma.x,ma.y); ctx.lineTo(mb.x,mb.y);
          ctx.stroke();
          ctx.restore();
        });
        // paint every layer in stacking order, each isolated on a small
        // reused scratch tile first and only then flattened onto the
        // cached bitmap — same reasoning as renderStaticLayers() above:
        // without this, an eraser stroke on one layer could eat into a
        // different layer's ink the moment they share one bitmap.
        const tileScratch = document.createElement('canvas');
        tileScratch.width = pxW; tileScratch.height = pxH;
        const scCtx = tileScratch.getContext('2d');
        scCtx.scale(2,2);
        sc.layers.forEach(layer=>{
          scCtx.clearRect(0,0,tileW,tileH);
          scCtx.globalAlpha = layer.opacity;
          if(layer.type==='image'){ drawImageIntoThumb(scCtx, layer, r, map); }
          else { paintLayer(layer.segments, scCtx); }
          scCtx.globalAlpha = 1;
          tctx.save(); tctx.setTransform(1,0,0,1,0,0);
          tctx.drawImage(tileScratch,0,0);
          tctx.restore();
        });
      }
      thumb.getContext('2d').drawImage(cache.canvas, 0, 0);
      thumb.title = 'Кадр ' + (sceneIdx+1);
      // Click switches to this scene; press-and-hold-still picks it up
      // for reordering instead -- beginFilmThumbGesture() below is what
      // tells the two apart, so this listener no longer decides that
      // itself.
      thumb.addEventListener('pointerdown', ev=>{ ev.stopPropagation(); beginFilmThumbGesture(ev, sceneIdx, thumb); });
      wrap.appendChild(thumb);
      wrap.appendChild(num);
      return wrap;
    } else {
      // empty slot: in front of the real block -> prepend a new scene
      // before the first one; behind it -> append a new scene after
      // the last one. Both are otherwise identical dashed "+" tiles.
      const addBtn = document.createElement('div');
      addBtn.className = 'filmAdd';
      addBtn.style.width = tileW+'px'; addBtn.style.height = tileH+'px';
      addBtn.textContent = '+';
      const isFront = sceneIdx<0;
      addBtn.title = isFront ? 'Новый кадр (в начало)' : 'Новый кадр';
      addBtn.addEventListener('pointerdown', ev=>{
        ev.stopPropagation();
        if(isFront) prependScene(); else addScene();
      });
      return addBtn;
    }
  }

  // --- filmstrip: press-and-hold a thumbnail to reorder it -------------
  // filmDrag is non-null for the ENTIRE gesture, from the initial
  // pointerdown through to release/cancel -- not just once it's actually
  // dragging. `armed` (false until the hold timer fires) is what
  // distinguishes "might still just be a click" from "now reordering
  // live". Keeping both under one object, rather than a separate
  // "pending" vs "dragging" flag, means there's exactly one place
  // (cleanup(), inside beginFilmThumbGesture) that ever nulls it out, so
  // gestureInProgress() and a stray second pointerdown elsewhere always
  // see consistent state.
  //   sc        - the scene object being moved (identity, not index --
  //               its index is exactly the thing that's changing)
  //   curIndex  - that scene's current live position in scenes[]
  //   pointerId - which pointer owns this gesture, so a second touch
  //               starting elsewhere is ignored by this gesture's own
  //               listeners rather than hijacking it
  //   armed     - true once the hold timer has fired
  //   grabDX/DY - where inside the tile the user actually pressed, so the
  //               floating ghost stays attached to that same spot under
  //               the pointer instead of snapping its corner to it
  let filmDrag = null;
  const FILM_DRAG_HOLD_MS = 220; // how long a press must hold still before it becomes a drag
  const FILM_DRAG_MOVE_SLOP = 10; // px of movement, before that hold fires, that reads as "scrolling the strip" instead and cancels it

  const filmDragGhostEl = document.getElementById('filmDragGhost');
  const filmDragGhostCanvas = filmDragGhostEl.querySelector('canvas');
  const filmDragGhostNum = filmDragGhostEl.querySelector('.filmThumbNum');

  // Moves the scene at fromIdx to end up at toIdx (both indices into
  // scenes[] as it stands right now), preserving every other scene's
  // relative order. activeScene is re-derived by identity
  // (scenes.indexOf) rather than patched by hand with shift arithmetic:
  // that's correct with zero risk of an off-by-one, regardless of
  // whether the scene being moved IS the active one, is unrelated to it,
  // or the move just happens to cross over it. Never touches
  // frame/strokeSegments/etc -- those are direct references into
  // whichever scene object is active, and that object's identity never
  // changes here, only where it lives in the array -- so this is safe to
  // run mid-drag without any of the loadView()/loadLayer() machinery
  // switchScene() needs for an actual scene change.
  function moveScene(fromIdx, toIdx){
    if(fromIdx===toIdx) return;
    const activeObj = scenes[activeScene];
    const [moved] = scenes.splice(fromIdx, 1);
    scenes.splice(toIdx, 0, moved);
    activeScene = scenes.indexOf(activeObj);
  }
  // Which scenes[] index a drag currently sitting at this viewport X
  // would land at if dropped right now. Snaps to the CLOSEST real tile's
  // center rather than "the tile strictly under the pointer", so the
  // target updates smoothly across gaps/spacers and naturally clamps to
  // 0/length-1 once the pointer's dragged past either end -- no special
  // casing needed for "before the first tile" or "past the last".
  function filmSlotIndexAt(clientX){
    const trackRect = filmTrack.getBoundingClientRect();
    const localX = clientX - trackRect.left + filmTrack.scrollLeft;
    const real = computeFilmSlots().slots.filter(s => s.sc);
    let best = 0, bestDist = Infinity;
    real.forEach((s, i) => {
      const d = Math.abs(localX - (s.x + s.w/2));
      if(d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  }
  function showFilmDragGhost(sc, w, h){
    filmDragGhostEl.style.width = w+'px';
    filmDragGhostEl.style.height = h+'px';
    filmDragGhostCanvas.width = w*2; filmDragGhostCanvas.height = h*2;
    filmDragGhostCanvas.style.width = w+'px'; filmDragGhostCanvas.style.height = h+'px';
    // reuse whatever's already cached for this scene's thumbnail -- it
    // was just painted moments ago building the real tile, so it's
    // guaranteed fresh; no need to re-stroke any ink to get a ghost
    const cache = sceneThumbCache.get(sc);
    if(cache) filmDragGhostCanvas.getContext('2d').drawImage(cache.canvas, 0, 0, filmDragGhostCanvas.width, filmDragGhostCanvas.height);
    filmDragGhostNum.textContent = String(filmDrag.curIndex+1);
    filmDragGhostEl.style.display = 'block';
  }
  function positionFilmDragGhost(clientX, clientY){
    filmDragGhostEl.style.left = (clientX - filmDrag.grabDX)+'px';
    filmDragGhostEl.style.top = (clientY - filmDrag.grabDY)+'px';
  }
  function hideFilmDragGhost(){
    filmDragGhostEl.style.display = 'none';
  }
  // Disambiguates a plain click (switch to this scene) from a
  // press-and-hold-then-drag (reorder it) off ONE pointerdown, without
  // ever blocking the filmstrip's native horizontal scroll:
  //  - releasing before the hold timer fires is a click -> switchScene().
  //  - moving past FILM_DRAG_MOVE_SLOP BEFORE the timer fires reads as
  //    swiping to scroll the strip, not holding still to pick a tile up
  //    -- the timer is cancelled and nothing is captured or prevented,
  //    so native scrolling proceeds exactly as if this listener weren't
  //    here at all.
  //  - holding still past FILM_DRAG_HOLD_MS arms the drag: from that
  //    point on, this pointer's moves reorder scenes[] live instead.
  function beginFilmThumbGesture(ev, sceneIdx, thumb){
    if(gestureInProgress()) return; // covers filmDrag too, see its clause there
    const pointerId = ev.pointerId;
    const startX = ev.clientX, startY = ev.clientY;
    filmDrag = { sc: scenes[sceneIdx], curIndex: sceneIdx, pointerId, armed:false };

    const holdTimer = setTimeout(arm, FILM_DRAG_HOLD_MS);

    function arm(){
      if(!filmDrag) return; // released/cancelled the same tick the timer fired -- nothing to do
      filmDrag.armed = true;
      const r = thumb.getBoundingClientRect();
      filmDrag.grabDX = startX - r.left;
      filmDrag.grabDY = startY - r.top;
      // may be silently released the moment the first live re-render
      // below replaces `thumb` with a fresh canvas -- harmless, since
      // move/up/cancel are handled on window regardless of capture.
      try{ thumb.setPointerCapture(pointerId); }catch(e){}
      document.documentElement.classList.add('film-dragging');
      showFilmDragGhost(filmDrag.sc, r.width, r.height);
      positionFilmDragGhost(startX, startY);
      renderFilmstripWindowed(false); // swap the source tile for its drop-slot placeholder now that it's "picked up"
    }
    function onMove(mv){
      if(mv.pointerId!==pointerId || !filmDrag) return;
      if(!filmDrag.armed){
        const dx = mv.clientX-startX, dy = mv.clientY-startY;
        if(Math.hypot(dx,dy) > FILM_DRAG_MOVE_SLOP){ clearTimeout(holdTimer); cleanup(); }
        return;
      }
      if(mv.cancelable) mv.preventDefault();
      positionFilmDragGhost(mv.clientX, mv.clientY);
      const target = filmSlotIndexAt(mv.clientX);
      if(target !== filmDrag.curIndex){
        moveScene(filmDrag.curIndex, target);
        filmDrag.curIndex = target;
        filmDragGhostNum.textContent = String(target+1);
        renderFilmstripWindowed(false);
      }
    }
    function onUp(up){
      if(up.pointerId!==pointerId) return;
      clearTimeout(holdTimer);
      if(filmDrag && filmDrag.armed) endFilmDrag();
      else { cleanup(); switchScene(sceneIdx); }
    }
    function onCancel(cv){
      if(cv.pointerId!==pointerId) return;
      clearTimeout(holdTimer);
      if(filmDrag && filmDrag.armed) endFilmDrag(); else cleanup();
    }
    function endFilmDrag(){
      hideFilmDragGhost();
      document.documentElement.classList.remove('film-dragging');
      cleanup();
      renderFilmstripWindowed(false); // scenes[] is already final -- this just swaps the drop-slot back for a real thumbnail
    }
    function cleanup(){
      filmDrag = null;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  }
  // Scrolling the tray (wheel or native drag) doesn't run through
  // renderFilmstripWindowed() on its own — nothing else would ever tell
  // the visible window to follow, leaving whatever the user scrolled INTO
  // view as empty spacers. Coalesced to at most once per animation frame,
  // same idea as scheduleHeavyRerender() above, since a fling/momentum
  // scroll can fire many 'scroll' events per frame.
  let filmstripScrollRAF = null;
  filmTrack.addEventListener('scroll', () => {
    if(filmstripScrollRAF) return;
    filmstripScrollRAF = requestAnimationFrame(() => {
      filmstripScrollRAF = null;
      renderFilmstripWindowed(false);
    });
  });

  // reveal the tray once the cursor drops below the drawing window's own
  // screen rect (or is already resting over the tray itself); hide it again
  // after a short grace delay so crossing the gap between window and tray
  // doesn't flicker it off
  let filmVisible = false, filmHideTimer = null;
  function updateFilmstripVisibility(clientX, clientY, target){
    const overTray = !!(target && target.closest && target.closest('#filmstrip'));
    const r = getFrameBoxRect();
    const belowFrame = clientY > r.bottom - 8 && clientX > r.left - 40 && clientX < r.right + 40;
    const show = overTray || belowFrame;
    if(show){
      if(filmHideTimer){ clearTimeout(filmHideTimer); filmHideTimer = null; }
      if(!filmVisible){ filmVisible = true; filmstripEl.classList.add('visible'); }
    } else if(filmVisible && !filmHideTimer){
      filmHideTimer = setTimeout(()=>{
        filmVisible = false; filmstripEl.classList.remove('visible'); filmHideTimer = null;
      }, 300);
    }
  }
  // anchors the tray directly under the drawing window's live on-screen
  // rect (same trick as syncHandles/focusRing) so it stays magnetized to
  // the canvas through pan/zoom/resize instead of sitting at a fixed
  // viewport position
  function positionFilmstrip(){
    const r = getFrameBoxRect();
    const sr = getStageRect();
    filmstripEl.style.left = (r.left - sr.left) + 'px';
    filmstripEl.style.top = (r.bottom - sr.top + TRAY_GAP) + 'px';
    filmstripEl.style.width = r.width + 'px';
    // Content rebuild goes through the same rAF-coalesced path as every
    // other camera-driven update (scheduleHeavyRerender, below) instead
    // of calling renderFilmstrip() directly here. This function is
    // called unconditionally from applyView() on literally every
    // wheel/pointermove/animation-frame tick that touches the camera —
    // calling the full (DOM-churning, O(all scenes' ink)) rebuild here
    // directly was exactly the gap that let it fire at full event rate
    // regardless of the throttle scheduleHeavyRerender() was built to
    // provide (see its own comment below). Positioning the tray element
    // itself, above, still happens every time — only the expensive
    // repaint of its contents is now coalesced.
    scheduleHeavyRerender();
  }

  // --- layer rail: circles + show/hide on cursor position, right of frame ---
  // Same appear-on-hover / scroll-with-fade mechanic as the filmstrip
  // above, rotated 90°, and the SAME asymmetric leading/trailing layout
  // too: one FIXED "add above" circle at the very top (never padded,
  // mirrors the filmstrip's own sceneStart=1), the real layers right
  // under it in real stacking order (highest index nearest the top, so
  // the topmost layer sits right below that one circle, near the top of
  // the rail — not centered), and every remaining slot is "add below",
  // stretching down to fill the rail the same way the filmstrip's
  // append side grows. The one real difference from the filmstrip,
  // per the brief: circles are a FIXED shape (not reshaped per scene's
  // aspect, since every layer already shares its one scene's own frame).
  const layerRailEl = document.getElementById('layerRail');
  const layerTrack = document.getElementById('layerTrack');
  const VISIBLE_COUNT_LAYERS = 5;
  const LAYER_FADE_PX = 24;
  function renderLayerRail(){
    layerTrack.innerHTML = '';
    const GAP = 8;
    const availH = getFrameBoxRect().height;
    const sc = scenes[activeScene];
    // The rail's normal circle size isn't a guess — it's exactly what the
    // OLD per-height formula used to compute LIVE, evaluated once at this
    // app's own canonical default project: a fresh 640×360 scene on-screen
    // at 100% zoom, i.e. frame.h*viewZoom === 360 (see FIT_REF above).
    // Derived from GAP/VISIBLE_COUNT_LAYERS right here (not copied as
    // separate magic numbers elsewhere) so it can't silently drift out of
    // sync if either constant ever changes.
    const LAYER_D = (360 - GAP*(VISIBLE_COUNT_LAYERS-1)) / VISIBLE_COUNT_LAYERS; // 65.6
    // how many slots we WANT visible at the rail's normal fixed size —
    // pad up to VISIBLE_COUNT_LAYERS when there are few real layers, so
    // the rail doesn't look sparse. This target doesn't depend on availH.
    const wantCount = Math.max(VISIBLE_COUNT_LAYERS, sc.layers.length+2);
    let td = LAYER_D; // fixed size, ALWAYS — the rail scrolls when there isn't enough height
    let count = wantCount;
    const neededForWant = wantCount*td + (wantCount-1)*GAP;
    if(availH >= neededForWant){
      // room to spare beyond what wantCount needs at the fixed size — GROW
      // the count (more add-slots) rather than the circles, to use up the
      // slack. This is the tall/portrait-frame case from the original ask.
      const fitCount = Math.floor((availH+GAP)/(td+GAP));
      count = Math.max(wantCount, fitCount);
    }
    // Exactly mirrors the filmstrip's own sceneStart=1 approach: ONE
    // fixed leading "add" slot (here: add-above) and never more, so the
    // first real layer always sits right under it near the top of the
    // TRACK — not centered, not pushed down by symmetric padding, WITHIN
    // the track's own contents. All padding needed to keep the row
    // looking full (out to VISIBLE_COUNT_LAYERS when there aren't enough
    // real layers on their own) goes to the TRAILING end instead, same as
    // the filmstrip's own append side — so "add below" is what stretches
    // toward the bottom edge, never "add above".
    // Separately, note #layerRail (the outer element, not this track) is
    // `justify-content:center` in CSS — so whenever count/td leave any
    // slack versus availH (routine: the GROW branch above deliberately
    // stops at most one slot short of filling it), the track as a WHOLE
    // sits centered with equal gaps above the first circle and below the
    // last, rather than pinned flush to the top. That's expected, not a
    // bug — just easy to mistake for one when eyeballing a screenshot.
    const aboveSlots = 1;
    // fade is a "there's more, scroll for it" hint — it should reflect
    // whether the circles actually overflow the rail's real height, not
    // whether we grew past the wantCount baseline. Growing (the branch
    // above) is deliberately computed so everything still fits — a taller
    // frame legitimately ending up with 6, 8, however many circles is not
    // overflow, so it must not fade. Circles are a FIXED size, so genuine
    // overflow = more/larger layers than fit at 65.6px, and the rail
    // scrolls (overflow-y:auto) with the fade hinting at the overflow.
    const contentH = count*td + (count-1)*GAP;
    layerTrack.style.setProperty('--fade', (contentH > availH + 0.5 ? LAYER_FADE_PX : 0)+'px');
    const r = frame; // every layer in this scene shares this one frame
    const sig = frameSig(r);
    let activeEl = null;
    for(let i=0;i<count;i++){
      if(i<aboveSlots || i>=aboveSlots+sc.layers.length){
        const above = i<aboveSlots;
        const addBtn = document.createElement('div');
        addBtn.className = 'layerAdd';
        addBtn.style.width = td+'px'; addBtn.style.height = td+'px';
        addBtn.textContent = '+';
        addBtn.title = above ? 'Новый слой выше' : 'Новый слой ниже';
        addBtn.addEventListener('pointerdown', ev=>{
          ev.stopPropagation();
          if(above) addLayerAbove(); else addLayerBelow();
        });
        layerTrack.appendChild(addBtn);
        continue;
      }
      // first real-layer slot (right under the above-pool) shows the
      // TOPMOST real layer (highest index); the last one (right above
      // the below-pool) shows the BOTTOMMOST (index 0) — i.e. rail
      // position mirrors array index, since the rail reads visually
      // top-to-bottom but the array is indexed bottom-to-top (see
      // addLayerAbove/Below's note)
      const layerIdx = sc.layers.length - 1 - (i - aboveSlots);
      const layer = sc.layers[layerIdx];
      const thumb = document.createElement('canvas');
      thumb.className = 'layerThumb' + (layerIdx===sc.activeLayer ? ' active' : '');
      thumb.width = td*2; thumb.height = td*2;
      thumb.style.width = td+'px'; thumb.style.height = td+'px';
      const pxD = thumb.width; // browser-coerced integer size, used as the cache key

      // same idea as the filmstrip's own cache above: skip re-stroking
      // this one layer's segments unless its ink, this circle's pixel
      // size, or the shared frame's geometry actually changed since the
      // last time it was painted.
      let cache = layerThumbCache.get(layer);
      if(!cache || cache.version!==layer.inkVersion || cache.d!==pxD || cache.sig!==sig || cache.op!==layer.opacity){
        if(!cache){ cache = { canvas: document.createElement('canvas') }; layerThumbCache.set(layer, cache); }
        cache.canvas.width = pxD; cache.canvas.height = pxD;
        cache.d = pxD; cache.version = layer.inkVersion; cache.sig = sig; cache.op = layer.opacity;
        const tctx = cache.canvas.getContext('2d');
        tctx.scale(2,2);
        // circular clip so content beyond the circle — necessarily
        // present for any frame that isn't itself square, since the
        // circle is a fixed shape unlike the filmstrip's per-scene
        // aspect tiles — is cropped rather than squeezed to fit
        tctx.save();
        tctx.beginPath();
        tctx.arc(td/2, td/2, td/2, 0, Math.PI*2);
        tctx.clip();
        tctx.fillStyle = '#f4f2ee';
        tctx.fillRect(0,0,td,td);
        // "cover" style crop, centered: the frame's SHORTER side exactly
        // matches the circle's diameter, its longer side overflows past
        // the circle edge and simply gets clipped — same idea as CSS
        // background-size:cover, just done by hand for a canvas
        const scale = td / Math.min(r.w, r.h);
        const offX = (td - r.w*scale)/2, offY = (td - r.h*scale)/2;
        const map = pt => ({ x:(pt.x-r.x)*scale + offX, y:(pt.y-r.y)*scale + offY });
        // this circle shows ONLY its own layer's ink, never composited
        // with any other layer — unlike the scene filmstrip thumbnail
        // below the frame, which deliberately shows the whole picture.
        // A single layer's own segments can never contain a stray
        // destination-out that reaches outside itself, so no scratch/
        // isolate step is needed here the way renderStaticLayers() and
        // the scene thumbnail above both need one.
        tctx.globalAlpha = layer.opacity;
        if(layer.type==='image'){
          drawImageIntoThumb(tctx, layer, r, map);
        } else {
          layer.segments.forEach(seg=>{
            const aIn = inFrameRect(seg.a,r), bIn = inFrameRect(seg.b,r);
            if(!aIn && !bIn) return;
            let a=seg.a, b=seg.b;
            if(!(aIn && bIn)){
              const exit = aIn ? rectExit(a,b,r) : rectExit(b,a,r);
              if(aIn) b = exit; else a = exit;
            }
            const ma = map(a), mb = map(b);
            tctx.save();
            if(seg.erase) tctx.globalCompositeOperation = 'destination-out';
            tctx.strokeStyle = 'rgba(30,28,24,.88)';
            tctx.lineWidth = Math.max(0.4, (seg.erase ? 16 : 2.2) * scale);
            tctx.lineCap = 'round';
            tctx.beginPath();
            tctx.moveTo(ma.x,ma.y); tctx.lineTo(mb.x,mb.y);
            tctx.stroke();
            tctx.restore();
          });
        tctx.globalAlpha = 1;
        }
        tctx.restore(); // pop the circular clip
      }
      thumb.getContext('2d').drawImage(cache.canvas, 0, 0);
      thumb.title = 'Слой ' + (layerIdx+1);
      thumb.addEventListener('pointerdown', ev=>{ ev.stopPropagation(); switchLayer(layerIdx); });
      const wrap = document.createElement('div');
      wrap.className = 'layerThumbWrap';
      wrap.style.width = td+'px'; wrap.style.height = td+'px';
      wrap.appendChild(thumb);
      if(layerIdx===sc.activeLayer){
        const ring = document.createElementNS('http://www.w3.org/2000/svg','svg');
        ring.setAttribute('class','layerEyeRing');
        ring.setAttribute('viewBox','0 0 100 100');
        const wSvg = (2*100)/td;        // 2 screen px expressed in SVG units
        const ringR = 50 + wSvg/2;      // inner edge hugs thumbnail (r=50), zero gap
        ring._r = ringR;                // reused by updateLayerEyeUI() for C
        const mkRingCircle = ()=>{
          const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
          c.setAttribute('cx','50'); c.setAttribute('cy','50');
          c.setAttribute('r',String(ringR)); c.setAttribute('fill','none');
          c.setAttribute('stroke','rgba(150,255,175,.9)');
          c.setAttribute('stroke-width',String(wSvg));
          c.setAttribute('transform','rotate(-90 50 50)'); // 0° at 12:00, grows clockwise
          return c;
        };
        const solidCircle = mkRingCircle();
        const dashCircle = mkRingCircle();
        ring.appendChild(solidCircle);
        ring.appendChild(dashCircle);
        const pct = document.createElement('div');
        pct.className = 'layerEyePct';
        const eye = document.createElement('div');
        eye.className = 'layerEye';
        eye.innerHTML = '<svg class="eyeOpen" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eyeClosed" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
        wrap.appendChild(ring);
        wrap.appendChild(pct);
        wrap.appendChild(eye);
        eye.addEventListener('pointerdown', ev=>{ ev.stopPropagation(); beginEyeGesture(ev, layerIdx, eye, thumb, ring, pct); });
        updateLayerEyeUI(eye, thumb, ring, pct, layer);
      }
      layerTrack.appendChild(wrap);
      if(layerIdx===sc.activeLayer) activeEl = wrap;
    }
    // same hand-computed scroll as the filmstrip's own note above, for
    // the same reason: scrollIntoView() here risks scrolling #stage
    // itself instead of just this rail when the rail has little slack.
    if(activeEl){
      const target = activeEl.offsetTop + activeEl.offsetHeight/2 - layerTrack.clientHeight/2;
      const maxScroll = layerTrack.scrollHeight - layerTrack.clientHeight;
      layerTrack.scrollTop = Math.max(0, Math.min(target, maxScroll));
    }
  }
  // --- layer eye: visibility toggle + opacity drag -----------------------
  const EYE_MAX_DRAG = 120;
  function updateLayerEyeUI(eye, thumb, ring, pct, layer){
    const op = layer.opacity;
    eye.classList.toggle('off', op===0);
    const solidCircle = ring.querySelectorAll('circle')[0];
    const dashCircle  = ring.querySelectorAll('circle')[1];
    const r = ring._r || 51;
    const C = 2*Math.PI*r;
    const t = 1 - op;
    const DASH = 4, GAP = 4;
    const dashArcLen  = t*C;
    const solidArcLen = C - dashArcLen;
    solidCircle.setAttribute('transform','rotate(-90 50 50)');
    dashCircle.setAttribute('transform','rotate(-90 50 50)');
    if(t <= 0){
      dashCircle.setAttribute('stroke-dasharray','0 '+C);
    } else {
      const pairs = Math.floor(dashArcLen/(DASH+GAP));

function saveCurrentFrame(){
  const sc = scenes[activeScene];

  const W = Math.max(1, Math.round(r.w)), H = Math.max(1, Math.round(r.h));
  const out = document.createElement('canvas');
  out.width = W; out.height = H;

  const scratch = document.createElement('canvas');
  scratch.width = W; scratch.height = H;
  const sctx = scratch.getContext('2d');
  const map = pt => ({ x: pt.x - r.x, y: pt.y - r.y });
  sc.layers.forEach(layer=>{
    sctx.clearRect(0, 0, W, H);
    sctx.globalAlpha = layer.opacity;

      sctx.save();
      sctx.beginPath();

        if(!aIn && !bIn) return;
        let a = seg.a, b = seg.b;
        if(!(aIn && bIn)){

        if(seg.erase) sctx.globalCompositeOperation = 'destination-out';
        sctx.strokeStyle = 'rgba(30,28,24,.88)';
        sctx.lineWidth = seg.erase ? 16 : 2.2;
        sctx.lineCap = 'round'; sctx.lineJoin = 'round';

  // promotes it (see promoteRefToLayer). Selecting happens on the same
  // pointerdown a drag would start from (a plain click with no movement
  // still counts as a press-then-release in place, so it selects without
  // needing a separate click handler).
  function startRefDrag(refEl, e){
    const id = Number(refEl.dataset.refId);
    const ref = references.find(r=>r.id===id);
    if(!ref) return;
    selectRef(ref);
    refDragging = true;
    let last = { x:e.clientX, y:e.clientY };
    refEl.classList.add('dragging');
    refEl.setPointerCapture(e.pointerId);
    const move = ev=>{
      const dx = (ev.clientX-last.x)/viewZoom, dy = (ev.clientY-last.y)/viewZoom;
      last = { x:ev.clientX, y:ev.clientY };
      ref.x += dx; ref.y += dy;
      refEl.style.left = ref.x+'px';
      refEl.style.top = ref.y+'px';
      syncRefHandles();
      syncRefDeleteBtn();
    };

      refDragging = false;
      refEl.classList.remove('dragging');
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);

    };

    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }

  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('#toolbar') || e.target.closest('#zoom') || e.target.closest('.handleZone') || e.target.closest('.imgHandleZone') || e.target.closest('.refHandleZone') || e.target.closest('.pictureDeleteBtn') || e.target.closest('#thirdsPanel')) return;
    const refEl = e.target.closest('.refItem');
    if(refEl){ startRefDrag(refEl, e); return; }

    if(!focused && isPointOnFrameScreen(e.clientX, e.clientY)){
      recenterView();
      return; // this click brings the window back; it doesn't draw
    }
    const activeLayerObj = scenes[activeScene].layers[scenes[activeScene].activeLayer];
    if(activeLayerObj.type==='image'){
      // drawing is disabled on an image layer -- a click on the frame
      // grabs the picture instead; a click elsewhere on stage does
      // nothing (no draw fallback, nothing else it could mean)
      if(isPointOnFrameScreen(e.clientX, e.clientY)) startImageDrag(e);
      return;
    }
    if(tool==='cursor') return; // cursor tool never draws -- reaching here means the click missed every picture, so there's simply nothing to do

    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e=>{
    lastCX = e.clientX; lastCY = e.clientY; lastTarget = e.target;
    if(!drawing){
      updateHoverAffordance();
      updateFilmstripVisibility(e.clientX, e.clientY, e.target);
      updateLayerRailVisibility(e.clientX, e.clientY, e.target);
      updateThirdsPanelVisibility(e.clientX, e.clientY, e.target);
      return;
    }
    const p = toWorld(e.clientX, e.clientY);
    draw(p.x, p.y);
  });
  stage.addEventListener('pointerleave', ()=>{
    if(thirdsPanelVisible && !thirdsPanelHideTimer){
      thirdsPanelHideTimer = setTimeout(()=>{ thirdsPanelVisible=false; thirdsPanelEl.classList.remove('visible'); thirdsPanelHideTimer=null; }, 300);
    }
    if(filmVisible && !filmHideTimer){
      filmHideTimer = setTimeout(()=>{ filmVisible=false; filmstripEl.classList.remove('visible'); filmHideTimer=null; }, 300);
    }
    if(railVisible && !railHideTimer){
      railHideTimer = setTimeout(()=>{ railVisible=false; layerRailEl.classList.remove('visible'); railHideTimer=null; }, 300);
    }
  });
  window.addEventListener('pointerup', ()=>{
    // Guarded on `drawing`: this listener is global (fires on EVERY
    // pointerup anywhere on the page) specifically so a stroke started on
    // #stage still commits even if the pointer ends up released outside
    // it. Without the guard it ALSO ran -- full renderFilmstrip()/
    // renderLayerRail() cost included -- on every release of moveBtn, an
    // image-layer drag/resize, a reference drag/resize, or a frame
    // corner/format drag, every one of which already renders itself at
    // the end of its own up handler. `drawing` is exclusively true for an

    // the other gesture flags are deliberately kept separate from it), so
    // this now only does real work for the one case it's actually for.
    if(!drawing) return;

    renderLayerRail();
  });

  document.querySelectorAll('#toolbar button[data-tool]').forEach(b=>{
    b.addEventListener('click', ()=>{
      // cursor tool is exempt: it's the one mode meant to grab an active
      // image layer, so it must NOT jump off it the way pen/eraser do
      if(b.dataset.tool!=='cursor') ensureDrawableActiveLayer(); // jump off an image layer onto a fresh one above it, if needed
      tool = b.dataset.tool;
      document.querySelectorAll('#toolbar button[data-tool]').forEach(x=>x.classList.toggle('active', x===b));
      // the pencil doubles as a "find the window" control: clicking it
      // always recenters the view, whether it was already active or not
      if(b===penBtn) recenterView();
    });
  });
  // Clears the ACTIVE LAYER only, not the whole scene — consistent with
  // pen/eraser/move all being scoped to whichever layer is currently
  // selected. Other layers in this scene are untouched, so there's no
  // need to also call renderStaticLayers() here (nothing it composites
  // has changed) — just the active layer's own two canvases, plus both
  // thumbnail rails that show its content.
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    const removed = strokeSegments.slice();
    strokeSegments.length = 0;
    pushClearHistory(removed);
    markInkChanged();
    renderStrokes(); // clears both canvases via the same from-scratch path everything else uses, rather than a second hand-written clearRect pair that has to be kept in sync by hand
    renderFilmstrip();
    renderLayerRail();
  });

  // Move tool: press-and-hold the button ITSELF, not "select a tool, then
  // drag on the canvas" like pen/eraser — deliberately, per how this was
  // scoped. Pointer capture stays on the button for the whole gesture
  // (same setPointerCapture-on-source-element + window-level move/up
  // pattern as the resize handles below), so the cursor never has to
  // reach the canvas and can wander anywhere on screen once the gesture
  // has started — only the frame-to-frame movement delta is used, so the
  // cursor is hidden for the duration (html.moving-ink in the CSS) rather
  // than left pointing at a screen position that's disconnected from
  // what's actually happening. frame/zoom/pan are never touched here —
  // only this scene's own ink shifts (translateInk), which is what
  // re-sorts each stroke black/white against the unmoving frame edge for
  // free, via renderStrokes()'s existing in/out classification.
  const moveBtn = document.getElementById('moveBtn');
  moveBtn.addEventListener('pointerdown', e=>{
    e.preventDefault();
    ensureDrawableActiveLayer(); // jump off an image layer onto a fresh one above it, if needed
    // Deliberately does NOT auto-recenter and proceed — that would move
    // the camera as a surprise side effect of a press meant to move ink,
    // and the user would be dragging blind for however long the spring-
    // back animation takes. Simpler and more honest to just refuse: red
    // glow on the button itself (not the window's own on-screen rect —
    // the whole point is this has to work even when that's nowhere the
    // user can see), no movement, no capture — the user recenters on
    // purpose (e.g. via the pen button, which already does this) and
    // then tries again once they can actually see what they're moving.
    if(!isFocused()){
      moveBtn.classList.add('blocked');
      const unblock = ()=>{
        moveBtn.classList.remove('blocked');
        window.removeEventListener('pointerup', unblock);
        window.removeEventListener('pointercancel', unblock);
      };
      window.addEventListener('pointerup', unblock);
      window.addEventListener('pointercancel', unblock);
      return;
    }
    moveBtn.setPointerCapture(e.pointerId);
    moveBtn.classList.add('active');
    document.documentElement.classList.add('moving-ink');
    let last = { x:e.clientX, y:e.clientY };
    const move = ev=>{
      const dxS = ev.clientX-last.x, dyS = ev.clientY-last.y;
      last = { x:ev.clientX, y:ev.clientY };
      if(!dxS && !dyS) return;
      // live viewZoom, not frozen at gesture start — unlike the corner-
      // resize/format-drag gestures below, this one never changes
      // viewZoom itself, so there's no feedback loop to guard against;
      // using the live value just keeps screen-px-moved matching
      // screen-px-shifted even if zoom happens to change from some
      // unrelated concurrent action mid-drag (e.g. a ctrl+wheel pinch).
      translateInk(dxS/viewZoom, dyS/viewZoom);
      markInkChanged();
      renderStrokes();
    };
    const up = ()=>{
      moveBtn.classList.remove('active');
      document.documentElement.classList.remove('moving-ink');
      renderFilmstrip();
      renderLayerRail();
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });

  function applyView(coverageAlreadyChecked){
    // the label reflects the user's own deliberate zoom relative to this
    // shot's auto-fit baseline (always "100%" right after a switch,
    // however big or small that shot's own window is) rather than the
    // raw effective CSS scale — showing the raw value would make a wide
    // shot read as e.g. "56%" even though its window looks exactly the
    // same size on screen as every other shot's
    zLabel.textContent = Math.round(zoomMultiplier*100)+'%';
    // translate is listed first so it moves the already-scaled element by
    // raw screen pixels — panning feels the same regardless of zoom level
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${viewZoom})`;
    // frameBox is a child of #world -- its own style didn't change, but
    // this transform just moved its effective screen position
    frameBoxRectCache = null;
    // panning/zooming is normally a free CSS transform (GPU-cheap, no
    // redraw) — only touch the canvas buffer when the visible area is
    // about to outgrow it. positionFrame() already computed this answer
    // by the time it calls applyView() and passes it straight in (see
    // there); it's only actually (re)computed here, with its own
    // getBoundingClientRect() reads, for callers that haven't already
    // checked — the wheel handler, zoom +/- clicks, and the recenter
    // animation's own applyView() call.
    const coverageChanged = coverageAlreadyChecked !== undefined ? coverageAlreadyChecked : ensureCanvasCoverage();
    if(coverageChanged){ updateClipPath(); renderAll(); }
    updateFocus();
    positionRatioTag();
    syncHandles();
    syncImageHandles();
    syncRefHandles();
    syncImgDeleteBtn();
    syncRefDeleteBtn();
    positionFilmstrip();
    positionLayerRail();
    positionThirdsPanel();
  }
  document.getElementById('zIn').addEventListener('click', ()=>{ zoomMultiplier = Math.min(zoomMultiplier*1.15, 4); updateZoom(); applyView(); });
  document.getElementById('zOut').addEventListener('click', ()=>{ zoomMultiplier = Math.max(zoomMultiplier/1.15, 0.25); updateZoom(); applyView(); });
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    if(e.ctrlKey){
      // trackpad pinch gesture is reported as a wheel event with ctrlKey set
      zoomMultiplier = Math.max(0.25, Math.min(4, zoomMultiplier * (e.deltaY<0?1.08:0.92)));
      updateZoom();
    } else {
      // two-finger trackpad pan / mouse-wheel scroll
      panTarget = null; // a manual pan cancels any in-flight recenter animation
      panX -= e.deltaX;
      panY -= e.deltaY;
    }
    applyView();
  }, {passive:false});

  // Two-finger trackpad gestures over the filmstrip should browse frames
  // (scroll the strip) instead of panning the canvas that happens to sit
  // behind/above it. Listened on the tray itself and stopped from
  // bubbling, so #stage's own wheel handler (which pans the world) never
  // sees these events at all.
  filmstripEl.addEventListener('wheel', e=>{
    e.preventDefault();
    e.stopPropagation();
    if(e.ctrlKey) return; // pinch-zoom gesture: just swallow it, no zoom here
    const delta = Math.abs(e.deltaX) >= Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    filmTrack.scrollLeft += delta;
  }, {passive:false});

  // which is the axis a plain wheel's deltaY already drives natively for
  // any overflow-y:auto element — no manual scrollTop math needed the
  // way the (horizontal) filmstrip above needs scrollLeft math. Only
  // still needed: stop the event from bubbling to #stage's own wheel
  // handler (which pans the canvas behind the rail), and swallow pinch-
  // zoom so it doesn't zoom the canvas while the cursor sits over here.
  layerRailEl.addEventListener('wheel', e=>{
    e.stopPropagation();
    if(e.ctrlKey) e.preventDefault();
  }, {passive:false});

  // every corner except top-left resizes the shot's own window,
  // aspect-preserving, anchored at its center. The window's ON-SCREEN
  // size is kept auto-normalized throughout the drag (see updateZoom),
  // so this always reads as zooming into the drawing itself — the box
  // you see never grows or shrinks, only how much of your ink fits
  // inside it does.
  const RESIZE_CORNERS = { tr:{x:1,y:-1}, bl:{x:-1,y:1}, br:{x:1,y:1} };
  Object.keys(RESIZE_CORNERS).forEach(corner=>{
    const zone = document.querySelector('.handleZone.'+corner);
    const sign = RESIZE_CORNERS[corner];
    zone.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      cornerDragging = true;
      // Cancels any elastic settle still easing from a PRIOR format-handle
      // (tlZone) drag -- same cancellation loadView() already does on a
      // scene switch, needed here for the same reason: elasticTick() keeps

      window.addEventListener('pointerup',up);
      window.addEventListener('pointercancel',up);

    });
  });

  // frame) — all 4 corners behave the same way here (plain aspect-

  // corner, since a photo doesn't have a format to snap to. Reuses the
  // exact same delta/anchor math as RESIZE_CORNERS above, just applied to
  // layer.ix/iy/iw/ih instead of frame.x/y/w/h, plus one addition: newW
  // is capped at the layer's own natW (loadAndCompressImage/
  // placeImageAsLayer both guarantee iw<=natW already, so this only ever
  // bites once the user actually drags past 100% -- see the brief:
  // "if a small picture was dropped, that's on the user, it never
  // upscales beyond its own resolution"). No startZoom-freezing needed
  // here the way the frame's own resize needs it: dragging this never
  // touches viewZoom itself, so there's no feedback loop to guard
  // against (same reasoning moveBtn's own ink-drag comment gives for
  // using the live value).
  const IMG_RESIZE_CORNERS = { tl:{x:-1,y:-1}, tr:{x:1,y:-1}, bl:{x:-1,y:1}, br:{x:1,y:1} };
  Object.keys(IMG_RESIZE_CORNERS).forEach(corner=>{
    const zone = imgHandleEls[corner];
    const sign = IMG_RESIZE_CORNERS[corner];
    zone.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      const sc = scenes[activeScene];
      const layer = sc.layers[sc.activeLayer];
      if(layer.type!=='image') return;
      imageDragging = true;
      const startX=e.clientX, startY=e.clientY;
      const startW=layer.iw, startH=layer.ih;

        y: sign.y>0 ? layer.iy : layer.iy+layer.ih

        const dx=(ev.clientX-startX)/viewZoom, dy=(ev.clientY-startY)/viewZoom;

        layer.iy = sign.y>0 ? anchor.y : anchor.y-newH;

        syncImgDeleteBtn();
        scheduleHeavyRerender();
      };

        imageDragging = false;
        window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);

      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      window.addEventListener('pointercancel',up);
      zone.setPointerCapture(e.pointerId);
    });
  });

  // Scale handles for the SELECTED REFERENCE -- same aspect-preserving,
  // opposite-corner-anchored math as IMG_RESIZE_CORNERS just above (same
  // natW cap: never upscale past the reference's own compressed
  // resolution, "small picture was your own problem" per the brief), the
  // one real difference being WHAT gets updated on every move tick: an
  // image layer is redrawn into a canvas (renderStrokes()), but a
  // reference IS a DOM element, so its own CSS left/top/width/height are
  // written directly instead.
  const REF_RESIZE_CORNERS = { tl:{x:-1,y:-1}, tr:{x:1,y:-1}, bl:{x:-1,y:1}, br:{x:1,y:1} };
  Object.keys(REF_RESIZE_CORNERS).forEach(corner=>{
    const zone = refHandleEls[corner];
    const sign = REF_RESIZE_CORNERS[corner];
    zone.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      const ref = selectedRef;
      if(!ref) return;
      refDragging = true;
      const startX=e.clientX, startY=e.clientY;
      const startW=ref.w, startH=ref.h;
      const aspect = startW/startH;
      const anchor = {
        x: sign.x>0 ? ref.x : ref.x+ref.w,
        y: sign.y>0 ? ref.y : ref.y+ref.h
      };
      const move=(ev)=>{
        const dx=(ev.clientX-startX)/viewZoom, dy=(ev.clientY-startY)/viewZoom;
        const delta = (dx*sign.x + dy*sign.y)/2;
        let newW = Math.max(20, startW + delta*2);
        newW = Math.min(newW, ref.natW); // never upscale past native resolution
        const newH = newW/aspect;
        ref.w = newW; ref.h = newH;
        ref.x = sign.x>0 ? anchor.x : anchor.x-newW;
        ref.y = sign.y>0 ? anchor.y : anchor.y-newH;
        ref.el.style.left = ref.x+'px'; ref.el.style.top = ref.y+'px';
        ref.el.style.width = ref.w+'px'; ref.el.style.height = ref.h+'px';

        syncRefDeleteBtn();
      };
      const up=()=>{
        refDragging = false;
        window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      };
      window.addEventListener('pointermove',move);
      window.addEventListener('pointerup',up);
      window.addEventListener('pointercancel',up);
      zone.setPointerCapture(e.pointerId);
    });
  });

  document.getElementById('imgDeleteBtn').addEventListener('click', e=>{
    e.stopPropagation();
    deleteImageLayer(activeScene, scenes[activeScene].activeLayer);
  });
  document.getElementById('refDeleteBtn').addEventListener('click', e=>{
    e.stopPropagation();
    if(selectedRef) deleteReference(selectedRef);
  });

  // --- dropping image files: onto the frame = a new picture layer,
  // onto the open gray canvas around it = a free-floating reference ---
  stage.addEventListener('dragover', e=>{ e.preventDefault(); });
  stage.addEventListener('drop', e=>{
    e.preventDefault();
    if(e.target.closest('#toolbar,#zoom,#filmstrip,#layerRail,#thirdsPanel')) return;
    const files = e.dataTransfer && e.dataTransfer.files ? Array.from(e.dataTransfer.files) : [];
    const file = files.find(f=>f.type && f.type.startsWith('image/'));
    if(!file) return;
    const p = toWorld(e.clientX, e.clientY);
    const dropOnFrame = inFrameRect(p, frameRect());
    loadAndCompressImage(file).then(({img,natW,natH})=>{
      if(dropOnFrame) placeImageAsLayer(img, natW, natH);
      else placeReference(img, natW, natH, p);
    }).catch(()=>{ /* unreadable file (corrupt/unsupported) -- silently ignored, same as a miss on files.find above */ });
  });

  // top-left corner: changes the FORMAT (aspect ratio) to the nearest standard preset,
  // anchored at the fixed bottom-right corner, with a rubbery/elastic catch-up animation
  const tlZone = document.querySelector('.handleZone.tl');
  tlZone.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    cornerDragging = true;
    updateHoverAffordance();
    // anchor on the frame's own center, so the format change is symmetric
    // in both directions instead of pinned to the opposite corner
    const center = { x: frame.x+frame.w/2, y: frame.y+frame.h/2 };
    elastic.center = center;
    elastic.active = true;
    ensureTickRunning();
    ratioTag.style.opacity = '1';

    // this way scale is determined only by which preset is picked, not
    // by how far the cursor is dragged; continuing to drag within the
    // same preset no longer keeps inflating the size
    const area = frame.w * frame.h;
    // frozen reference for interpreting the cursor during this whole
    // gesture — see the resize-corner handler above for why this can't
    // read the live viewZoom once the frame (and so viewZoom) starts
    // changing under the cursor
    const startZoom = viewZoom;
    const wr = world.getBoundingClientRect();
    const toWorldFrozen = (clientX, clientY) => ({ x:(clientX-wr.left)/startZoom, y:(clientY-wr.top)/startZoom });
    const move=(ev)=>{
      const p = toWorldFrozen(ev.clientX, ev.clientY);
      // distance from center, mirrored to both sides -> used only to
      // detect direction/ratio, not to set absolute size
      let rawW = (center.x - p.x)*2, rawH = (center.y - p.y)*2;
      rawW = Math.max(1, rawW); rawH = Math.max(1, rawH);
      const preset = nearestPreset(rawW/rawH);
      const ratio = preset.w/preset.h;
      // derive w/h from the fixed area + chosen preset's ratio
      let targetW = Math.sqrt(area*ratio);
      let targetH = targetW/ratio;
      targetW = Math.max(90, targetW);
      targetH = Math.max(60, targetH);
      elastic.targetW = targetW; elastic.targetH = targetH;
      ratioTag.textContent = preset.label;
    };
    const up=(ev)=>{
      cornerDragging = false;
      lastCX=ev.clientX; lastCY=ev.clientY;
      updateHoverAffordance();
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      // fade the label out once it's basically settled (or stop polling
      // outright if a scene switch already cancelled this gesture — after
      // that, `frame` may refer to a different scene entirely, so this
      // stale target should never be compared against it again)
      const check = setInterval(()=>{
        if(!elastic.active || (Math.abs(frame.w-elastic.targetW)<0.5 && Math.abs(frame.h-elastic.targetH)<0.5)){
          ratioTag.style.opacity='0'; elastic.active=false; clearInterval(check);
          renderAll(); // guarantee one full, untimed pass — elasticTick() throttles the expensive tier while settling
        }
      }, 120);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
    tlZone.setPointerCapture(e.pointerId);
  });

  // continuous rubber-band easing loop — shared by the format handle and
  // by "click to recenter" (reusing one animation loop instead of two).
  // Only runs while there's actually something to animate: used to call
  // requestAnimationFrame(elasticTick) unconditionally forever, which
  // meant a rAF callback firing ~60x/sec for the entire life of the tab
  // even when totally idle (the vast majority of a session). Harmless on
  // its own, but there's no reason to pay even that much when idle — see
  // ensureTickRunning() below, called from the two places that actually
  // start an animation (elastic.active=true and panTarget being set).
  let tickRAF = null;
  function ensureTickRunning(){
    if(!tickRAF) tickRAF = requestAnimationFrame(elasticTick);
  }
  function elasticTick(){
    tickRAF = null;
    if(elastic.active){
      frame.w += (elastic.targetW - frame.w)*0.16;
      frame.h += (elastic.targetH - frame.h)*0.16;
      frame.x = elastic.center.x - frame.w/2;
      frame.y = elastic.center.y - frame.h/2;
      updateZoom();
      positionFrame();
      renderStrokes();
      scheduleHeavyRerender();
    }
    if(panTarget){
      // time-based ease-out over a fixed duration: deceleration is spread
      // across the whole move and stays visible, instead of a lerp where
      // most of the distance vanishes in the first frame
      const t = Math.min(1, (performance.now()-panStart)/PAN_DURATION);
      const e = easeDock(t);
      panX = panFrom.x + (panTarget.x-panFrom.x)*e;
      panY = panFrom.y + (panTarget.y-panFrom.y)*e;
      if(t>=1) panTarget = null;
      applyView();
    }
    if(elastic.active || panTarget) tickRAF = requestAnimationFrame(elasticTick);
  }

  // Many browsers fire 'resize' repeatedly while the user is actively
  // dragging the OS window's edge, not just once at the end. resize()
  // now allocates a CAPPED (not multi-gigabyte) canvas buffer, but it's
  // still real allocation + a full renderAll() — no reason to pay that
  // cost on every intermediate frame of the drag instead of once after
  // the user actually settles on a size.
  let resizeDebounceTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeDebounceTimer);
    resizeDebounceTimer = setTimeout(resize, 150);
  });
  resize();
  updateHistoryButtons();
})();
</script>
</body>
</html>
